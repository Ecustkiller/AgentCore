# downloads.example.com — 品牌下载静态站（桌面安装包 / APK / electron-updater feed）
# 由 sync:release-cdn / downloads-remote-install.sh 同步到 nginx sites-available。
# Tunnel 远程托管 ingress 时：在 Cloudflare Zero Trust → Tunnel 加 Public Hostname
#   downloads.<brand> → http://127.0.0.1:8092
# 实际域名用 env 覆盖（默认占位 downloads.example.com）。

server {
    listen 127.0.0.1:8092;
    server_name downloads.example.com;

    root /opt/agentcore/downloads;
    autoindex off;

    # Version manifests (latest.json / electron-updater yml): short cache + public CORS.
    # Capacitor WebView / admin SPA fetch these cross-origin; APK/exe themselves are
    # opened via browser navigation (no CORS). OPTIONS must not 405.
    location ~* /(?:latest(?:-mac)?\.yml|latest\.json)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            return 204;
        }

        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    types {
        application/json                           json;
        text/yaml                                  yml yaml;
        application/octet-stream                   exe blockmap;
        application/x-apple-diskimage              dmg;
        application/zip                            zip;
        application/vnd.android.package-archive    apk;
    }
}
