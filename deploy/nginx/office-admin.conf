# office.example.com — 管理后台静态 SPA（apps/admin）+ 自有 /api/ 反代 参考 snippet。
# 由 deploy-admin.yml 或 admin-remote-install.sh 同步到 nginx sites-available 并 reload。
# 反向代理 / Tunnel 将 office 子域指到本机 Nginx（与通配兜底共存时靠 server_name 匹配）。
# 实际域名用 env / GitHub vars 覆盖（默认占位 office.example.com）。
#
# 为什么 admin 必须有自己的 /api/（别删了改回指向 app. 域）：
# auth cookie 不带 domain= → host-only，落在**被访问的 API 主机**上，且 path=/。
# admin 若继续打 app. 域的 /api，两个 SPA 就共用同一份 access_token cookie，
# 后登录者静默顶替先登录者 —— 受害端会读到对方账号的 /v1/auth/me 与 /v1/auth/sessions
# （含 IP、设备列表），写操作也落到对方账号上。同源后各自的 cookie 互不相干。
# 注意这隔离的是 **cookie jar，不是信任边界**：两域仍共用同一个 JWT 密钥，
# 一侧泄露的令牌在另一侧照样验得过。

server {
    listen 127.0.0.1:8090;
    server_name office.example.com;

    root /opt/agentcore/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 挂载点必须是 /api（与 COOKIE_PATH_PREFIX=/api 对齐，否则 refresh cookie 的
    # path 与实际路径对不上 → 刷新静默失败）。末尾斜杠剥掉前缀：/api/v1/x → /v1/x。
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：会话复盘等流式页面靠这几行。缓冲一开，事件会被攒着不下发，
        # 前端表现为「一直转圈然后整段蹦出来」。与 app. 域的 /api/ 块同口径。
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
