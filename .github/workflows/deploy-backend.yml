name: Deploy Backend

# 后端部署（部署与运维.md §7.2 发布点 / §三 CI/CD）。
# push prod-* tag → SSH 到生产服务器 → 跑 deploy-server.sh <tag>：
#   fetch→解析 tag 为 SHA→起基础设施→迁移前 pg_dump 快照→alembic upgrade→compose up→
#   /readyz 健康检查→记 .last-deployed-sha（失败不记 SHA、退非零）。
#
# master 是 WIP 主干、HEAD≠可上线点（§7.2）：部署只认 prod-* 发布点，不随 master 自动上线。
# 镜像由 build-backend.yml 在 push master 时已构建推 ACR，故 prod-* tag 指向的 SHA 必有镜像。
# 回退：对旧 prod-* tag（或旧 SHA）重跑本流（手动 dispatch 填 ref）——deploy-server.sh
# 自动识别为回退、跳过正向迁移（库需对齐时从 backups/ 手动恢复，§7.7）。
#
# 需配 secrets（源码仓 Settings → Secrets and variables → Actions）：
#   DEPLOY_SSH_HOST   服务器地址（公网 IP / 域名）
#   DEPLOY_SSH_USER   SSH 用户（对 $AGENTCORE_HOME 与 docker 有权）
#   DEPLOY_SSH_KEY    SSH 私钥（对应公钥已加服务器 authorized_keys）
#   DEPLOY_SSH_PORT   SSH 端口（可选，默认 22）
# 服务器前置（一次性，见 deploy-server.sh 头注 / §8.2）：
#   $AGENTCORE_HOME/repo 已 clone；$AGENTCORE_HOME/.env 含 ACR 凭据（拉 VPC 端点）+
#   IMAGE_REGISTRY；deploy/config/production.env 已填值。

on:
  push:
    tags:
      - "prod-*"
  workflow_dispatch:
    inputs:
      ref:
        description: "部署目标 ref（prod-* tag / 短 SHA / latest）；回退填旧 prod-* tag"
        required: true
        default: latest

# 部署串行，且【绝不】中断进行中的部署（迁移中途被杀会留下半截 schema）。
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy-server.sh over SSH
        uses: appleboy/ssh-action@v1
        env:
          # tag 触发用 tag 名；手动 dispatch 用输入的 ref。
          DEPLOY_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_REF
          # 命令失败即整步失败（ssh-action 透传远端退出码）。deploy-server.sh 自身
          # set -euo pipefail + 健康检查失败退非零，故部署不健康时本 job 会红。
          script: |
            set -euo pipefail
            HOME_DIR="${AGENTCORE_HOME:-/opt/agentcore}"
            echo "==> deploy ref=${DEPLOY_REF} home=${HOME_DIR}"
            "${HOME_DIR}/repo/deploy/scripts/deploy-server.sh" "${DEPLOY_REF}"
