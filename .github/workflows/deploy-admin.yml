name: Deploy Admin Console

# 管理后台 apps/admin → 生产机 /opt/agentcore/admin/dist + Nginx（office.fashitianxia.xyz）。
# 经 Cloudflare Tunnel 暴露（见 deploy/nginx/office-admin.conf，本机 :8090）。
# API：VITE_API_URL=https://app.fashitianxia.xyz/api；CORS 须含 https://office.fashitianxia.xyz。
#
# 触发：master 上 admin 改动 / deploy 资产 / openapi 契约，或手动 dispatch。
# 需 secrets：DEPLOY_SSH_*；首次上线后须 create_admin.py 创建管理员。

on:
  push:
    branches: [master]
    paths:
      - "apps/admin/**"
      - "apps/server/openapi.json"
      - "deploy/nginx/office-admin.conf"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy admin to production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: apps/admin
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Generate API types
        working-directory: apps/admin
        run: npx --yes openapi-typescript@7.13.0 ../server/openapi.json -o src/types/api.generated.ts

      - name: Build admin SPA
        working-directory: apps/admin
        env:
          VITE_API_URL: https://app.fashitianxia.xyz/api
        run: pnpm build

      - name: Pack dist tarball
        run: tar -czf admin-dist.tgz -C apps/admin dist

      - name: Upload dist tarball
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: admin-dist.tgz
          target: /tmp

      - name: Upload nginx site config
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: deploy/nginx/office-admin.conf
          target: /tmp

      - name: Install static files, nginx site, CORS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ORIGIN="https://office.fashitianxia.xyz"
            ADMIN_ROOT="/opt/agentcore/admin"
            DEPLOY="${AGENTCORE_DEPLOY_DIR:-/opt/agentcore/repo/deploy_f6d1637}"
            REPO="${AGENTCORE_HOME:-/opt/agentcore}/repo"
            ENVF="$DEPLOY/config/production.env"
            NGINX_AVAIL="/etc/nginx/sites-available/office-admin"
            NGINX_ENABLED="/etc/nginx/sites-enabled/office-admin"

            mkdir -p "$ADMIN_ROOT"
            rm -rf "$ADMIN_ROOT/dist"
            tar xzf /tmp/admin-dist.tgz -C "$ADMIN_ROOT"
            rm -f /tmp/admin-dist.tgz
            echo "admin static → $ADMIN_ROOT/dist ($(find "$ADMIN_ROOT/dist" -type f | wc -l) files)"

            sudo install -D -m 644 /tmp/office-admin.conf "$NGINX_AVAIL" 2>/dev/null \
              || sudo install -D -m 644 /tmp/deploy/nginx/office-admin.conf "$NGINX_AVAIL"
            rm -f /tmp/office-admin.conf /tmp/deploy/nginx/office-admin.conf
            ln -sfn "$NGINX_AVAIL" "$NGINX_ENABLED"
            sudo nginx -t
            sudo systemctl reload nginx
            LOCAL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: office.fashitianxia.xyz' http://127.0.0.1:8090/ || true)"
            echo "nginx reloaded; local probe :8090 → HTTP ${LOCAL_CODE}"
            echo "若公网仍 502：Cloudflare Tunnel 须将 office.fashitianxia.xyz → http://127.0.0.1:8090"

            [[ -f "$ENVF" ]] || { echo "ERROR: $ENVF missing"; exit 1; }
            if grep -q 'office\.fashitianxia\.xyz' "$ENVF"; then
              echo "CORS already includes $ORIGIN"
            elif grep -q '^CORS_ALLOW_ORIGINS=' "$ENVF"; then
              sed -i "s|^CORS_ALLOW_ORIGINS=\(.*\)|CORS_ALLOW_ORIGINS=\1,${ORIGIN}|" "$ENVF"
              echo "appended $ORIGIN to CORS_ALLOW_ORIGINS"
            else
              echo "CORS_ALLOW_ORIGINS=${ORIGIN}" >>"$ENVF"
            fi
            grep '^CORS_ALLOW_ORIGINS=' "$ENVF"

            COMPOSE=( docker compose -p agentcore \
              -f "$DEPLOY/docker-compose.server.yml" \
              -f "$DEPLOY/docker-compose.app.yml" \
              --env-file "$ENVF" )
            "${COMPOSE[@]}" up -d api
            echo "api recreated for CORS"

      - name: Ensure Tunnel ingress office → :8090
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: REDACTED_CLOUDFLARE_ACCOUNT_ID
          OFFICE_HOST: office.fashitianxia.xyz
          OFFICE_SERVICE: http://127.0.0.1:8090
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          api() { curl -sS "$@" "${auth[@]}"; }

          tunnels="$(api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel")"
          echo "$tunnels" | jq -e '.success' >/dev/null || {
            echo "::warning::Cannot list tunnels (token may lack Tunnel Edit). Skip tunnel patch."
            exit 0
          }

          tunnel_id=""
          current_cfg=""
          while IFS= read -r row; do
            tid="$(echo "$row" | jq -r '.id')"
            cfg="$(api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${tid}/configurations")"
            if echo "$cfg" | jq -e --arg h "$OFFICE_HOST" \
              '.result.config.ingress[]? | select(.hostname == $h or .hostname | test("fashitianxia\\.xyz"))' >/dev/null 2>&1; then
              tunnel_id="$tid"
              current_cfg="$cfg"
              break
            fi
            if echo "$cfg" | jq -e '.result.config.ingress[]? | select(.hostname | test("\\*\\.fashitianxia\\.xyz"))' >/dev/null 2>&1; then
              tunnel_id="$tid"
              current_cfg="$cfg"
              break
            fi
          done < <(echo "$tunnels" | jq -c '.result[]')

          if [[ -z "$tunnel_id" ]]; then
            echo "::warning::No fashitianxia tunnel found; skip ingress patch"
            exit 0
          fi

          existing="$(echo "$current_cfg" | jq -r --arg h "$OFFICE_HOST" --arg s "$OFFICE_SERVICE" \
            '.result.config.ingress[]? | select(.hostname == $h) | .service' | head -n1)"
          if [[ "$existing" == "$OFFICE_SERVICE" ]]; then
            echo "Tunnel ingress already ${OFFICE_HOST} → ${OFFICE_SERVICE}"
            exit 0
          fi

          new_body="$(echo "$current_cfg" | jq -c --arg h "$OFFICE_HOST" --arg s "$OFFICE_SERVICE" '
            .result.config as $cfg
            | ($cfg.ingress // []) as $ingress
            | ($ingress | map(select((.hostname // "") != $h))) as $filtered
            | ($filtered | to_entries | map(select(
                (.value.hostname // "") == ""
                or (.value.hostname | test("\\*"))
              )) | .[0].key // ($filtered | length)) as $insertAt
            | ($filtered[0:$insertAt]
              + [{hostname: $h, service: $s, originRequest: {}}]
              + $filtered[$insertAt:]) as $merged
            | if ($merged[-1].hostname // "") != "" or ($merged[-1].service | startswith("http_status:") | not) then
                $merged + [{service: "http_status:404"}]
              else $merged end
            | {config: ($cfg + {ingress: .})}
          ')"

          resp="$(api -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${tunnel_id}/configurations" \
            -H 'Content-Type: application/json' \
            --data "$new_body")"
          echo "$resp" | jq .
          echo "$resp" | jq -e '.success' >/dev/null
          echo "Tunnel ingress patched: ${OFFICE_HOST} → ${OFFICE_SERVICE}"
