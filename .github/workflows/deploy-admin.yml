name: Deploy Admin Console

# 管理后台 apps/admin → 生产机 /opt/agentcore/admin/dist + Nginx（office.fashitianxia.xyz）。
# 经 Cloudflare Tunnel 暴露（见 deploy/nginx/office-admin.conf，本机 :8090）。
# API：VITE_API_URL=https://app.fashitianxia.xyz/api；CORS 须含 https://office.fashitianxia.xyz。
#
# 触发：master 上 admin 改动 / deploy 资产 / openapi 契约，或手动 dispatch。
# 需 secrets：DEPLOY_SSH_*；首次上线后须 create_admin.py 创建管理员。

on:
  push:
    branches: [master]
    paths:
      - "apps/admin/**"
      - "apps/server/openapi.json"
      - "deploy/nginx/office-admin.conf"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy admin to production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: apps/admin
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Generate API types
        working-directory: apps/admin
        run: npx --yes openapi-typescript@7.13.0 ../server/openapi.json -o src/types/api.generated.ts

      - name: Build admin SPA
        working-directory: apps/admin
        env:
          VITE_API_URL: https://app.fashitianxia.xyz/api
        run: pnpm build

      - name: Pack dist tarball
        run: tar -czf admin-dist.tgz -C apps/admin dist

      - name: Upload dist tarball
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "admin-dist.tgz,deploy/nginx/office-admin.conf"
          target: /tmp

      - name: Install static files, nginx site, CORS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ORIGIN="https://office.fashitianxia.xyz"
            ADMIN_ROOT="/opt/agentcore/admin"
            DEPLOY="${AGENTCORE_DEPLOY_DIR:-/opt/agentcore/repo/deploy_f6d1637}"
            REPO="${AGENTCORE_HOME:-/opt/agentcore}/repo"
            ENVF="$DEPLOY/config/production.env"
            NGINX_AVAIL="/etc/nginx/sites-available/office-admin"
            NGINX_ENABLED="/etc/nginx/sites-enabled/office-admin"

            mkdir -p "$ADMIN_ROOT"
            rm -rf "$ADMIN_ROOT/dist"
            tar xzf /tmp/admin-dist.tgz -C "$ADMIN_ROOT"
            rm -f /tmp/admin-dist.tgz
            echo "admin static → $ADMIN_ROOT/dist ($(find "$ADMIN_ROOT/dist" -type f | wc -l) files)"

            sudo install -D -m 644 /tmp/office-admin.conf "$NGINX_AVAIL"
            rm -f /tmp/office-admin.conf
            ln -sfn "$NGINX_AVAIL" "$NGINX_ENABLED"
            sudo nginx -t
            sudo systemctl reload nginx
            echo "nginx reloaded (office-admin → 127.0.0.1:8090)"

            [[ -f "$ENVF" ]] || { echo "ERROR: $ENVF missing"; exit 1; }
            if grep -q 'office\.fashitianxia\.xyz' "$ENVF"; then
              echo "CORS already includes $ORIGIN"
            elif grep -q '^CORS_ALLOW_ORIGINS=' "$ENVF"; then
              sed -i "s|^CORS_ALLOW_ORIGINS=\(.*\)|CORS_ALLOW_ORIGINS=\1,${ORIGIN}|" "$ENVF"
              echo "appended $ORIGIN to CORS_ALLOW_ORIGINS"
            else
              echo "CORS_ALLOW_ORIGINS=${ORIGIN}" >>"$ENVF"
            fi
            grep '^CORS_ALLOW_ORIGINS=' "$ENVF"

            COMPOSE=( docker compose -p agentcore \
              -f "$DEPLOY/docker-compose.server.yml" \
              -f "$DEPLOY/docker-compose.app.yml" \
              --env-file "$ENVF" )
            "${COMPOSE[@]}" up -d api
            echo "api recreated for CORS"
