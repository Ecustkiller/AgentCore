name: Check Mobile Pages Domain

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e784e487f8ab57882d4b24d845ccfad1
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/agentcore-mobile/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq .
          echo "--- probe ---"
          curl -sS -o /dev/null -w "pages.dev=%{http_code}\n" https://agentcore-mobile.pages.dev/
          curl -sS -o /dev/null -w "m=%{http_code}\n" https://m.fashitianxia.xyz/
