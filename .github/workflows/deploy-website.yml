name: Deploy Website

# 官网（apps/website）静态站 + Pages Functions 部署到 Cloudflare Pages。
# /download 运行时经 functions/api/desktop-release 拉 GitHub Latest（5min 缓存）；
# 构建时 fetch-release.mjs 仍写 download.generated.ts 作首屏/离线回退。
# 触发：master 上 website 改动 / desktop-v* 桌面发布完成后 / 手动 dispatch。

on:
  push:
    branches: [master]
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_run:
    workflows: ["Release Desktop"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    # workflow_run：仅在 Release Desktop 成功后才刷新下载页（避免 release 失败仍更新官网）。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      # 官网是独立 lockfile（不在根 pnpm workspace），须 --ignore-workspace 避免误装整仓。
      - name: Install dependencies
        working-directory: apps/website
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build static site
        working-directory: apps/website
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: REDACTED_CLOUDFLARE_ACCOUNT_ID
          workingDirectory: apps/website
          command: pages deploy out --project-name=agentcore-website --branch=main
