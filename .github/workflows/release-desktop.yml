name: Release Desktop

# 桌面端安装包发布（部署与运维.md §7.6 双仓发布；Mac 见 07-规划/Mac桌面端部署设计.md）。
#
# 触发方式：
#   · push tag desktop-v<ver>  → 预建 draft → matrix 并行 Win + macOS(arm64)
#   · workflow_dispatch        → 可选只构建 win / mac / all（补发单平台、不重打 tag）
#
# 跨仓发布需 PAT：secrets.RELEASE_GH_TOKEN（对 Lawofall/AgentCore-releases 有写权）。

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform (tag push always builds all)"
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac

jobs:
  precreate-release:
    name: Pre-create draft release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_ver="$(node -p "require('./package.json').version")"
          tag_ver="${GITHUB_REF_NAME#desktop-v}"
          if [[ "$pkg_ver" != "$tag_ver" ]]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_ver) != package.json version $pkg_ver"
            exit 1
          fi
          echo "version ok: $pkg_ver"

      - name: Pre-create draft release (avoid parallel-upload race)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="v${ver}"
          repo="Lawofall/AgentCore-releases"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "release $tag already exists on $repo — reuse it"
          else
            gh release create "$tag" --repo "$repo" --draft --title "$ver" --notes "AgentCore $ver"
            echo "created draft $tag on $repo"
          fi

  release:
    name: Build & publish (${{ matrix.label }})
    needs: precreate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform_key: win
            builder_args: --win
          - os: macos-latest
            label: macOS arm64
            platform_key: mac
            builder_args: --mac --arm64
    # tag push → 全平台；workflow_dispatch → 按输入筛选（可只补 Mac）
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == matrix.platform_key
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter agentcore-desktop...

      - name: Bundle sidecar Python runtime
        run: pnpm bundle:sidecar

      - name: Build & publish to release repo (draft)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          pnpm build
          pnpm exec electron-builder ${{ matrix.builder_args }} --publish always
