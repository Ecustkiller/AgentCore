name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentcore
          POSTGRES_PASSWORD: agentcore
          POSTGRES_DB: agentcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://agentcore:agentcore@localhost:5432/agentcore
          TEST_DATABASE_URL: postgresql+asyncpg://agentcore:agentcore@localhost:5432/agentcore
        run: uv run pytest --tb=short

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --run
