name: Patch Office Tunnel (SSH)

# 在生产机上为 office.fashitianxia.xyz 写入 cloudflared ingress → http://127.0.0.1:8090。
# 用于 CLOUDFLARE_API_TOKEN 无 Tunnel Edit 时的兜底；需 DEPLOY_SSH_*。
on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch cloudflared ingress on production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            OFFICE_HOST=office.fashitianxia.xyz
            OFFICE_SERVICE=http://127.0.0.1:8090

            CONFIG=""
            for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml \
              /root/.cloudflared/config.yml "$HOME/.cloudflared/config.yml"; do
              if [[ -f "$f" ]]; then CONFIG="$f"; break; fi
            done

            if [[ -z "$CONFIG" ]]; then
              echo "::error::No cloudflared config.yml found on server"
              sudo find /etc /root /home -maxdepth 3 -name 'config.yml' 2>/dev/null | head -20 || true
              exit 1
            fi
            echo "Using cloudflared config: $CONFIG"
            sudo cat "$CONFIG"

            python3 - "$CONFIG" "$OFFICE_HOST" "$OFFICE_SERVICE" <<'PY'
            import sys, pathlib, re
            path, host, service = sys.argv[1:4]
            text = pathlib.Path(path).read_text(encoding="utf-8")

            block = (
                f"  - hostname: {host}\n"
                f"    service: {service}\n"
            )

            if re.search(rf"hostname:\s*{re.escape(host)}\b", text):
                text = re.sub(
                    rf"(  - hostname: {re.escape(host)}\n    service: ).*",
                    rf"\g<1>{service}",
                    text,
                )
                print(f"updated existing ingress for {host}")
            elif "ingress:" in text:
                text = re.sub(
                    r"(ingress:\n)",
                    r"\1" + block,
                    text,
                    count=1,
                )
                print(f"inserted ingress for {host} at top of ingress list")
            else:
                print("::error::config has no ingress: section", file=sys.stderr)
                sys.exit(1)

            pathlib.Path(path).write_text(text, encoding="utf-8")
            PY

            echo "Patched config:"
            sudo cat "$CONFIG"

            if systemctl is-active --quiet cloudflared 2>/dev/null; then
              sudo systemctl restart cloudflared
              sleep 2
              systemctl is-active cloudflared
            elif systemctl is-active --quiet cloudflared.service 2>/dev/null; then
              sudo systemctl restart cloudflared.service
              sleep 2
              systemctl is-active cloudflared.service
            else
              echo "::warning::cloudflared systemd unit not found; config written but not restarted"
              systemctl list-units --type=service | grep -i cloud || true
            fi

            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: ${OFFICE_HOST}" http://127.0.0.1:8090/ || true)"
            echo "local nginx probe :8090 → HTTP ${CODE}"
