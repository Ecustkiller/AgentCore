name: Promote Backend

# 将已预构建的镜像切到生产：SSH → finish-server.sh。
# 日常等价于 `pnpm deploy:backend:switch <sha>`。镜像须已由本地 `pnpm deploy:backend <sha>`
# 或备用 build-backend.yml 推 ACR。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref（短 SHA / 分支 / prod-* tag）；默认 master"
        required: false
        default: master

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: meta
        run: |
          ref="${{ inputs.ref }}"
          sha="$(git rev-parse --short "${ref}^{commit}")"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Deploy target: $ref → $sha"

      # A batch push only creates one CI run (head SHA); the ancestor check
      # proves the target commit is covered instead of requiring a run per commit.
      - name: Verify CI and backend image build for SHA
        run: |
          set -euo pipefail
          sha="$(git rev-parse "${{ inputs.ref }}^{commit}")"
          ci_sha="$(gh run list --workflow=ci.yml --branch master --limit 20 \
            --json conclusion,headSha --jq '[.[] | select(.conclusion=="success")][0].headSha // ""')"
          if [ -z "$ci_sha" ]; then
            echo "::error::No successful CI run found on master; refusing to deploy" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$ci_sha"; then
            echo "::error::Target $sha is not covered by the latest green CI run ($ci_sha)" >&2
            exit 1
          fi
          build="$(gh run list --workflow=build-backend.yml --commit "$sha" \
            --json conclusion --jq '.[0].conclusion // "missing"')"
          if [ "$build" != "success" ]; then
            echo "::error::build-backend conclusion for $sha is '$build'" >&2
            exit 1
          fi
          echo "CI ($ci_sha) and build-backend succeeded for $sha"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy via finish-server.sh
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            HOME_DIR="${AGENTCORE_HOME:-/opt/agentcore}"
            REPO="$HOME_DIR/repo"
            cd "$REPO"
            git fetch --tags --force --quiet origin
            bash "$REPO/deploy/scripts/finish-server.sh" "${DEPLOY_SHA}"

      - name: Record promoted SHA on server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            # Idempotent: finish-server.sh already writes this after /readyz 200.
            HOME_DIR="${AGENTCORE_HOME:-/opt/agentcore}"
            echo "${DEPLOY_SHA}" >"$HOME_DIR/.last-deployed-sha"
            echo "recorded .last-deployed-sha=${DEPLOY_SHA}"
