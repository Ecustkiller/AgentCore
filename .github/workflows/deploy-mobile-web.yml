name: Deploy Mobile Web

# 手机端网页版（apps/mobile）静态 SPA → Cloudflare Pages。
# 生产：https://m.fashitianxia.xyz（自定义域名在 CF Pages 项目 agentcore-mobile 绑定）。
# API：VITE_API_URL 指向 https://app.fashitianxia.xyz/api（Nginx /api 反代前缀）。
#
# 触发：master 上 mobile / 共享包改动，或手动 dispatch。
# 需 secrets：CLOUDFLARE_API_TOKEN（与 deploy-website.yml 共用）、DEPLOY_SSH_*（patch-cors job）。
# 自定义域 m.fashitianxia.xyz：Pages 绑定 + 显式 DNS CNAME（须压过 *.fashitianxia.xyz Tunnel 兜底）。

on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/design-tokens/**"
      - "packages/contract-types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-mobile-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mobile-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter agentcore-mobile...

      - name: Build mobile web SPA
        env:
          VITE_API_URL: https://app.fashitianxia.xyz/api
        run: pnpm --filter agentcore-mobile build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e784e487f8ab57882d4b24d845ccfad1
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list | grep -q 'agentcore-mobile'; then
            npx --yes wrangler@4 pages project create agentcore-mobile --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e784e487f8ab57882d4b24d845ccfad1
        run: npx --yes wrangler@4 pages deploy apps/mobile/dist --project-name=agentcore-mobile --branch=main

      - name: Bind custom domain m.fashitianxia.xyz
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e784e487f8ab57882d4b24d845ccfad1
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cf-domain.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/agentcore-mobile/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"name":"m.fashitianxia.xyz"}')"
          if [[ "$code" == "200" || "$code" == "201" || "$code" == "409" ]]; then
            echo "custom domain ok (HTTP $code)"
          else
            echo "domain bind returned HTTP $code:"
            cat /tmp/cf-domain.json
            exit 1
          fi

      - name: Ensure DNS CNAME m → Pages (override *. tunnel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE=fashitianxia.xyz
          FQDN=m.${ZONE}
          TARGET=agentcore-mobile.pages.dev
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zone_id="$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" \
            "${auth[@]}" | jq -r '.result[0].id')"
          [[ -n "$zone_id" && "$zone_id" != "null" ]] || { echo "zone ${ZONE} not found"; exit 1; }
          body="$(jq -nc --arg n m --arg c "$TARGET" \
            '{type:"CNAME",name:$n,content:$c,proxied:true,ttl:1}')"
          existing="$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${FQDN}" \
            "${auth[@]}")"
          record_id="$(echo "$existing" | jq -r '.result[0].id // empty')"
          if [[ -n "$record_id" ]]; then
            echo "updating DNS ${FQDN} → ${TARGET}"
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
              "${auth[@]}" -H 'Content-Type: application/json' --data "$body" | jq '{success,errors}'
          else
            echo "creating DNS ${FQDN} → ${TARGET}"
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
              "${auth[@]}" -H 'Content-Type: application/json' --data "$body" | jq '{success,errors}'
          fi

  patch-cors:
    name: Patch production CORS + restart api
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Ensure mobile origin in CORS_ALLOW_ORIGINS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            ORIGIN="https://m.fashitianxia.xyz"
            DEPLOY="${AGENTCORE_DEPLOY_DIR:-/opt/agentcore/repo/deploy_f6d1637}"
            ENVF="$DEPLOY/config/production.env"
            [[ -f "$ENVF" ]] || { echo "ERROR: $ENVF missing"; exit 1; }

            if grep -q 'm\.fashitianxia\.xyz' "$ENVF"; then
              echo "CORS already includes $ORIGIN"
            elif grep -q '^CORS_ALLOW_ORIGINS=' "$ENVF"; then
              sed -i "s|^CORS_ALLOW_ORIGINS=\(.*\)|CORS_ALLOW_ORIGINS=\1,${ORIGIN}|" "$ENVF"
              echo "appended $ORIGIN to CORS_ALLOW_ORIGINS"
            else
              echo "CORS_ALLOW_ORIGINS=${ORIGIN}" >>"$ENVF"
              echo "created CORS_ALLOW_ORIGINS with $ORIGIN"
            fi
            grep '^CORS_ALLOW_ORIGINS=' "$ENVF"

            COMPOSE=( docker compose -p agentcore \
              -f "$DEPLOY/docker-compose.server.yml" \
              -f "$DEPLOY/docker-compose.app.yml" \
              --env-file "$ENVF" )
            "${COMPOSE[@]}" up -d api
            echo "api container recreated with updated env"
