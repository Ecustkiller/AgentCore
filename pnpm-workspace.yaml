# AgentCore 工作区（手机端落地设计 P0 · 地基）
#
# 作用域刻意最小：只纳入「新代码」——共享规范/类型/token 包 + 手机端 app。
# 现有 apps（desktop/admin/website 用 pnpm，promo 用 npm）暂不纳入，
# 避免用根 lockfile 重解析正在运行的 desktop 与并行 agent 的安装。
#   - apps/mobile：M3 已加入（全新手机端实现）
#   - apps/desktop：M1 接入 contract-types 时以最小扰动方式加入
packages:
  - "packages/*"
  - "apps/mobile"
