# AgentCore 桌面端打包配置（P2-1；docs/05-平台与运维/部署与运维.md §7.6、
# docs/04-前端/前端技术与架构.md §7.6）。出 Windows(NSIS) / macOS(DMG) / Linux(AppImage)；
# MVP 不签名（自签，正式发布前再申请代码签名证书）。Win 优先。
#
# 用法：
#   pnpm build:unpack   # 仅解包到 release/<ver>/，快速验证打包（不编译 NSIS）
#   pnpm build:win      # 出 Windows NSIS 安装包
# 产物落 release/<version>/（被 .gitignore 忽略）。

appId: xyz.fashitianxia.agentcore
productName: AgentCore

directories:
  output: release/${version}
  buildResources: build

# out/ 是 electron-vite 自包含产物（main/preload/renderer 全打进，依赖已 bundle），
# 故只需打包 out/ + package.json，不随包附带 node_modules，安装包更精简。
files:
  - out/**
  - package.json

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentCore

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility

# electron-updater 发布目标：安装包发公开发布仓、源码仓保持私有（部署与运维.md §7.6）。
# CI（.github/workflows/release-desktop.yml）经 `--publish always` 推草稿 release。
# owner/repo 指向公开发布仓（与源码仓 Lawofall/AgentCore 分离）；该仓需人工先建好，
# 跨仓发布凭据走 secrets.RELEASE_GH_TOKEN（默认 GITHUB_TOKEN 无跨仓写权）。
publish:
  provider: github
  owner: Lawofall
  repo: AgentCore-releases
  releaseType: draft
