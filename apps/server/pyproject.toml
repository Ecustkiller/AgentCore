[project]
name = "agentcore"
version = "0.1.0"
description = "AgentCore - Multi-Agent AI Workspace Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "sse-starlette>=2.2",
    "pwdlib[argon2]>=0.3.0",
    "boto3>=1.43.29",
    "cryptography>=49.0.0",
    "pillow>=12.2.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# 内置 Python 打包（方案 B）瘦身用的 sidecar 运行时**子集**。来源 = ``agentcore.sidecar.server``
# 的**静态 import 闭包**：引擎 + ``api.schemas`` 在 import 期会传递性拉入 DB/auth 层（故
# sqlalchemy/asyncpg/jose/pwdlib/passlib/cryptography 必须保留，否则连 import 都过不去）。
# 而 HTTP 栈（fastapi/uvicorn/starlette/sse-starlette）、迁移（alembic）、缓存（redis）、
# 对象存储（boto3——仅 storage/s3.py 内惰性 import）、缩略图（pillow——仅 messaging）均
# **不在 sidecar 回合路径上**，故剔除（boto3 体积最大）。``scripts/bundle-sidecar.mjs`` 以
# ``--no-deps`` 装 agentcore 包本体 + 本组依赖，故基础 ``dependencies``（完整 server）对
# server/Docker/dev 安装保持不变。**改基础 deps 的共享子集时需同步本组。**
sidecar = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pwdlib[argon2]>=0.3.0",
    "cryptography>=49.0.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.28",
]

[project.scripts]
agentcore = "agentcore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated Alembic migration scripts: don't lint generated boilerplate.
extend-exclude = ["agentcore/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "A002", "E402"]

[tool.ruff.lint.per-file-ignores]
# Prompt-template module: long lines are verbatim LLM instructions, not code;
# reflowing them would change what the planner model receives.
"agentcore/runtime/planner.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Pin tmp dirs to a fixed, project-local basetemp (gitignored via .pytest_*/). The
# default auto-numbered base (<tmp>/pytest-of-<user>/) keeps a `pytest-current`
# symlink whose session-finish cleanup throws PermissionError [WinError 5] on Windows
# (symlink stat denied), making the run exit non-zero even when every test passed. A
# fixed --basetemp skips that numbered-dir + symlink machinery entirely.
addopts = "--basetemp=.pytest_tmp"
