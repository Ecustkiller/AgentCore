<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念 8 · 极简一页 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .c8 { max-width: 620px; margin: 0 auto; padding: 60px 24px 90px; }
      .c8 .center { text-align: center; }
      .kicker { font-size: 12px; color: var(--muted-foreground); letter-spacing: 0.06em; font-weight: 600; }
      .verdict { font-size: 30px; font-weight: 820; letter-spacing: -0.01em; margin: 14px 0 0; color: var(--side); line-height: 1.2; }
      .conf { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 13px; color: var(--muted-foreground); }
      .conf .meter { width: 120px; }
      .why { font-size: 15px; line-height: 1.75; color: var(--foreground); margin: 20px auto 0; max-width: 520px; }

      .one { margin: 38px auto 0; max-width: 520px; border: 1px solid color-mix(in oklch, var(--warning) 45%, var(--border)); border-radius: var(--radius-lg); padding: 18px 20px; background: color-mix(in oklch, var(--warning) 7%, var(--card)); }
      .one .ot { font-size: 13px; font-weight: 650; display: flex; gap: 7px; align-items: center; color: var(--warning-foreground); }
      .one .oq { font-size: 14.5px; line-height: 1.6; margin: 9px 0 15px; }
      .one .opts { display: flex; gap: 10px; }
      .one .opts button { flex: 1; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm); padding: 11px 12px; font-family: inherit; font-size: 13px; cursor: pointer; line-height: 1.45; transition: 0.12s; }
      .one .opts button .imp { display: block; font-size: 11px; color: var(--muted-foreground); margin-top: 3px; }
      .one .opts button:hover { border-color: color-mix(in oklch, var(--warning) 55%, var(--border)); background: var(--background); }
      .one .opts button[aria-pressed="true"] { border-color: var(--warning); background: var(--background); box-shadow: var(--shadow-sm); font-weight: 650; }
      .one .picked { margin-top: 13px; font-size: 13px; color: var(--foreground); display: none; align-items: center; gap: 7px; }
      .one .picked.show { display: flex; }
      .one .picked .ico { color: var(--success); }

      .expand { display: block; margin: 30px auto 0; border: 0; background: none; color: var(--muted-foreground); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; padding: 8px; }
      .expand:hover { color: var(--foreground); }
      .expand .chev { transition: 0.18s; }
      .expand.open .chev { transform: rotate(180deg); }

      .more { display: none; margin-top: 22px; border-top: 1px solid var(--border); padding-top: 24px; text-align: left; }
      .more.open { display: block; }
      .more section { margin-bottom: 24px; }
      .more .section-label { margin-bottom: 11px; }
      .more .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .more .sp { border: 1px solid var(--border); border-top: 3px solid var(--side); border-radius: var(--radius-sm); padding: 12px 13px; }
      .more .sp .nm { font-weight: 650; color: var(--side); font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
      .more .sp .pt { font-size: 12.5px; line-height: 1.65; }
      .more p.crux { font-size: 13.5px; line-height: 1.7; margin: 0; color: var(--foreground); }
      .more ul.lst { margin: 0; padding: 0; list-style: none; }
      .more ul.lst li { position: relative; padding-left: 16px; font-size: 13px; line-height: 1.6; margin-bottom: 7px; }
      .more ul.lst li::before { content: ""; position: absolute; left: 3px; top: 9px; width: 4px; height: 4px; border-radius: 999px; background: var(--muted-foreground); }
      .more .round { display: flex; gap: 12px; padding: 8px 0; }
      .more .round .no { flex: none; }
      .more .round .rc .focus { font-weight: 600; font-size: 13px; }
      .more .round .rc .sum { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.6; margin-top: 3px; }
      @media (max-width: 560px) { .more .duo { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const winner = sideBy(D.brief.leaningSide);
      const firstSentence = D.brief.leaning.split("。")[0] + "。";

      const c8 = h("div", { class: "c8", style: `--side: var(${winner.colorVar})` });

      // minimal core
      c8.append(
        h(
          "div",
          { class: "center" },
          h("div", { class: "kicker" }, "主持人裁决"),
          h("div", { class: "verdict" }, D.brief.leaningTitle),
          h(
            "div",
            { class: "conf" },
            "置信 " + D.brief.confidencePct + "%",
            h("span", { class: "meter" }, h("span", { style: `width:${D.brief.confidencePct}%` })),
            D.brief.confidenceLabel,
          ),
          h("p", { class: "why" }, firstSentence),
        ),
      );

      // the one decision
      const picked = h("div", { class: "picked" });
      const one = h(
        "div",
        { class: "one" },
        h("div", { class: "ot" }, svg("user", 14), "只有一件需要你定"),
        h("div", { class: "oq" }, "你认为「正统」该按哪个标准？"),
      );
      const opts = h("div", { class: "opts" });
      [
        { t: "原初工艺", imp: "点卤即咸 → 倾向 咸", r: "你选「工艺本源」—— 与 AI 当前倾向一致：咸为正统。" },
        { t: "历史流变", imp: "流传最广 → 倾向 甜", r: "你选「历史流变」—— 结论翻转为：甜为正统。" },
      ].forEach((o) => {
        const b = h("button", { "aria-pressed": "false" }, o.t, h("span", { class: "imp" }, o.imp));
        b.addEventListener("click", () => {
          opts.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          picked.replaceChildren(h("span", { class: "ico" }, svg("check", 15)), o.r);
          picked.classList.add("show");
        });
        opts.append(b);
      });
      one.append(opts, picked);
      c8.append(one);

      // expand-all
      const more = h("div", { class: "more" });
      const expandBtn = h("button", { class: "expand" }, svg("chevronDown", 16), h("span", {}, "展开全部 · 论点 / 争点 / 过程"), h("span", { class: "chev" }, ""));
      expandBtn.addEventListener("click", () => {
        const open = more.classList.toggle("open");
        expandBtn.classList.toggle("open", open);
        expandBtn.querySelector("span").textContent = open ? "收起" : "展开全部 · 论点 / 争点 / 过程";
      });

      more.append(
        h(
          "section",
          {},
          h("div", { class: "section-label" }, h("span", { class: "ico" }, svg("swords", 15)), "各方最强论点"),
          h(
            "div",
            { class: "duo" },
            ...D.sides.map((s) =>
              h(
                "div",
                { class: "sp", style: `--side: var(${s.colorVar})` },
                h("div", { class: "nm" }, h("span", { class: "id-dot", style: `--side: var(${s.colorVar})` }), s.name + " · " + s.stance),
                h("div", { class: "pt" }, s.point),
              ),
            ),
          ),
        ),
        h("section", {}, h("div", { class: "section-label" }, h("span", { class: "ico" }, svg("target", 15)), "争点"), h("p", { class: "crux" }, D.brief.crux)),
        h(
          "section",
          {},
          h("div", { class: "section-label" }, h("span", { class: "ico" }, svg("search", 15)), "还需厘清"),
          h("ul", { class: "lst" }, ...D.brief.factualDisputes.concat(D.brief.openQuestions).map((t) => h("li", {}, t))),
        ),
        h(
          "section",
          {},
          h("div", { class: "section-label" }, h("span", { class: "ico" }, svg("scroll", 15)), "交锋过程 · " + D.rounds.length + " 轮"),
          ...D.rounds.map((r) =>
            h(
              "div",
              { class: "round" },
              h("span", { class: "no pill pill-muted" }, "第 " + r.no + " 轮"),
              h("div", { class: "rc" }, h("div", { class: "focus" }, r.focus), h("div", { class: "sum" }, r.summary)),
            ),
          ),
        ),
      );

      c8.append(expandBtn, more);
      document.getElementById("root").append(c8);
    </script>
  </body>
</html>
