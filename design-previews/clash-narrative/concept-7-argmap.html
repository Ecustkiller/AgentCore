<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念 7 · 论证地图 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .c7 { max-width: 920px; margin: 0 auto; padding: 24px 24px 50px; }
      .c7 .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .c7 h1.page { margin: 6px 0 4px; font-size: 21px; font-weight: 750; }
      .c7 .page-sub { font-size: 13.5px; color: var(--muted-foreground); margin-bottom: 16px; }

      .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 14px; font-size: 12.5px; color: var(--muted-foreground); }
      .legend .it { display: inline-flex; align-items: center; gap: 7px; }
      .legend .ln { width: 26px; height: 0; border-top: 2px solid var(--muted-foreground); }
      .legend .ln.red { border-top-color: var(--destructive); }
      .legend .ln.salty { border-top: 2px dashed var(--agent-salty); }

      .mapwrap { overflow-x: auto; padding-bottom: 6px; }
      .map { position: relative; width: 860px; height: 640px; margin: 0 auto; }
      .map svg { position: absolute; inset: 0; width: 860px; height: 640px; pointer-events: none; }

      .node {
        position: absolute; box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-lg);
        background: var(--card); box-shadow: var(--shadow-sm); padding: 10px 13px; font-size: 12.5px; line-height: 1.55; overflow: hidden;
      }
      .node .nh { font-weight: 650; font-size: 11.5px; display: flex; align-items: center; gap: 6px; margin-bottom: 5px; color: var(--muted-foreground); }
      .node.side { border-top: 3px solid var(--side); }
      .node.side .nh { color: var(--side); }
      .node.side .nh .nm { font-weight: 700; }
      .node.root { background: var(--muted); border-style: solid; display: grid; place-items: center; text-align: center; font-weight: 750; font-size: 13.5px; }
      .node.thesis { font-weight: 600; }
      .node.judge { border-color: color-mix(in oklch, var(--warning) 45%, var(--border)); background: color-mix(in oklch, var(--warning) 8%, var(--card)); }
      .node.judge .nh { color: var(--warning-foreground); }
      .node.need { border-style: dashed; border-color: color-mix(in oklch, var(--warning) 45%, var(--border)); background: color-mix(in oklch, var(--warning) 5%, var(--card)); }
      .node .body { color: var(--foreground); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const sweet = sideBy("sweet"), salty = sideBy("salty");

      const c7 = h("div", { class: "c7" });
      c7.append(
        h("div", { class: "eyebrow" }, "论证地图 · 把辩论画成「谁支持谁、谁反驳谁」"),
        h("h1", { class: "page" }, "看的是推理结构，不是散文"),
        h("div", { class: "page-sub" }, "每个论点是一个节点，连线表示支持或反驳 —— 交锋点 = 两个节点之间的攻击边。"),
        h(
          "div",
          { class: "legend" },
          h("span", { class: "it" }, h("span", { class: "ln" }), "支持 / 延伸"),
          h("span", { class: "it" }, h("span", { class: "ln red" }), "反驳交锋"),
          h("span", { class: "it" }, h("span", { class: "ln salty" }), "裁判倾向"),
        ),
      );

      const map = h("div", { class: "map" });
      const svgLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgLayer.setAttribute("viewBox", "0 0 860 640");
      svgLayer.innerHTML = `
        <defs>
          <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--muted-foreground)"/></marker>
          <marker id="ah-red" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--destructive)"/></marker>
          <marker id="ah-salty" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--agent-salty)"/></marker>
        </defs>
        <g fill="none" stroke-width="2">
          <path d="M430,72 C430,104 220,98 220,130" stroke="var(--muted-foreground)" marker-end="url(#ah-grey)" opacity="0.55"/>
          <path d="M430,72 C430,104 640,98 640,130" stroke="var(--muted-foreground)" marker-end="url(#ah-grey)" opacity="0.55"/>
          <path d="M220,222 L220,293" stroke="var(--muted-foreground)" marker-end="url(#ah-grey)" opacity="0.55"/>
          <path d="M640,222 L640,293" stroke="var(--muted-foreground)" marker-end="url(#ah-grey)" opacity="0.55"/>
          <path d="M475,330 L395,330" stroke="var(--destructive)" marker-end="url(#ah-red)"/>
          <path d="M385,354 L465,354" stroke="var(--destructive)" marker-end="url(#ah-red)"/>
          <path d="M600,460 L636,394" stroke="var(--agent-salty)" stroke-dasharray="5 4" marker-end="url(#ah-salty)"/>
          <path d="M430,524 L430,554" stroke="var(--muted-foreground)" marker-end="url(#ah-grey)" opacity="0.55"/>
        </g>
        <text x="430" y="318" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--destructive)">反驳</text>
        <text x="556" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--agent-salty)">倾向</text>
      `;
      map.append(svgLayer);

      const node = (cls, x, y, w, hh, head, body) =>
        h(
          "div",
          { class: "node " + cls, style: `left:${x}px;top:${y}px;width:${w}px;height:${hh}px` },
          head ? h("div", { class: "nh" }, head) : null,
          h("div", { class: "body" }, body),
        );
      const sideHead = (s) => [h("span", { class: "id-dot", style: `--side: var(${s.colorVar})` }), h("span", { class: "nm" }, s.name + " · " + s.stance)];

      map.append(
        node("root", 250, 20, 360, 52, null, "辩题 · 甜 vs 咸豆腐脑，谁是正统？"),
        h("div", { class: "node side thesis", style: `left:55px;top:130px;width:330px;height:92px;--side: var(${sweet.colorVar})` }, h("div", { class: "nh" }, ...sideHead(sweet)), h("div", { class: "body" }, "糖中和豆腥是自然选择；南方「豆腐花」甜口百年传承，更早更稳定。")),
        h("div", { class: "node side thesis", style: `left:475px;top:130px;width:330px;height:92px;--side: var(${salty.colorVar})` }, h("div", { class: "nh" }, ...sideHead(salty)), h("div", { class: "body" }, "卤水点制本身致咸；古代糖稀缺，千年只能咸食，文献也指向咸。")),
        h("div", { class: "node side", style: `left:55px;top:295px;width:330px;height:92px;--side: var(${sweet.colorVar})` }, h("div", { class: "nh" }, svg("message", 12), "第 2 轮 · 退守"), h("div", { class: "body" }, "「正统」该看流传最广、最被接受的形态，而非诞生瞬间的味觉。")),
        h("div", { class: "node side", style: `left:475px;top:295px;width:330px;height:92px;--side: var(${salty.colorVar})` }, h("div", { class: "nh" }, svg("message", 12), "第 2 轮 · 反击"), h("div", { class: "body" }, "「豆腐花」甜口是蔗糖普及后的地方创新，代表不了原初形态。")),
        node("judge", 250, 460, 360, 64, [svg("gavel", 13), "裁判"], "事实层已无新证据，倾向「咸为正统」· 置信 65%。"),
        node("need", 210, 556, 440, 72, [svg("user", 13), "需你拍板（AI 判不了）"], "「正统 = 工艺本源 还是 历史流变」「是否接受南北各为地域正统」—— 这两条得你定。"),
      );

      const mapwrap = h("div", { class: "mapwrap" }, map);
      c7.append(mapwrap);
      document.getElementById("root").append(c7);
    </script>
  </body>
</html>
