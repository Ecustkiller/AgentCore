<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>直播态 · 重心迁移 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .cl { max-width: 920px; margin: 0 auto; padding: 22px 24px 60px; }
      .cl .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .cl h1.page { margin: 6px 0 4px; font-size: 21px; font-weight: 750; }
      .cl .page-sub { font-size: 13px; color: var(--muted-foreground); margin-bottom: 18px; }

      /* transport */
      .livebar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow-sm); margin-bottom: 8px; }
      .phasechip { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; padding: 5px 11px; border-radius: 999px; }
      .phasechip.live { background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); }
      .phasechip.judging { background: color-mix(in oklch, var(--warning) 14%, transparent); color: var(--warning-foreground); }
      .phasechip.settled { background: color-mix(in oklch, var(--success) 14%, transparent); color: var(--success); }
      .phasechip .dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
      .phasechip.live .dot { animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .livebar .status { flex: 1; min-width: 0; font-size: 13px; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .livebar .pp { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; cursor: pointer; }
      .scrubrow { display: flex; align-items: center; gap: 12px; margin: 10px 2px 4px; }
      .scrubrow .scrub { flex: 1; accent-color: var(--primary); cursor: pointer; }
      .scrubrow .fno { flex: none; font-size: 12px; color: var(--muted-foreground); min-width: 96px; text-align: right; white-space: nowrap; }
      .hintbar { font-size: 12px; color: var(--muted-foreground); margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }

      /* surface */
      .surface { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow-sm); padding: 20px 22px; min-height: 340px; }

      /* pending verdict strip (live) */
      .pending { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px dashed var(--border); color: var(--muted-foreground); font-size: 12.5px; margin-bottom: 18px; }
      .pending.judging { border-style: solid; border-color: color-mix(in oklch, var(--warning) 40%, var(--border)); background: color-mix(in oklch, var(--warning) 7%, var(--card)); color: var(--warning-foreground); }
      .pending .shim { flex: 1; height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--border) 25%, color-mix(in oklch, var(--warning) 30%, var(--border)) 50%, var(--border) 75%); background-size: 200% 100%; animation: shim 1.3s linear infinite; }
      @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* live arena */
      .live-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
      .live-head .rno { font-size: 13px; font-weight: 700; }
      .rnd { margin-bottom: 18px; }
      .rnd .focus { font-size: 12.5px; color: var(--muted-foreground); margin-bottom: 10px; }
      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .spk { border: 1px solid var(--border); border-top: 3px solid var(--side); border-radius: var(--radius-sm); padding: 11px 13px; background: var(--card); }
      .spk .nm { display: flex; align-items: center; gap: 7px; font-weight: 650; color: var(--side); font-size: 12.5px; margin-bottom: 7px; }
      .spk .nm .st { margin-left: auto; font-size: 11px; font-weight: 600; }
      .spk .nm .st.typing { color: var(--primary); }
      .spk .body { font-size: 12.5px; line-height: 1.65; color: var(--foreground); }
      .spk.wait { opacity: 0.6; }
      .spk.wait .body { color: var(--muted-foreground); }
      .caret { display: inline-block; width: 2px; height: 1em; background: var(--side, var(--primary)); margin-left: 2px; vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .modnote { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; padding: 10px 13px; border-radius: var(--radius-sm); background: var(--muted); font-size: 12.5px; line-height: 1.6; }
      .modnote .ico { color: var(--muted-foreground); margin-top: 1px; }
      .waitstart { text-align: center; color: var(--muted-foreground); font-size: 13px; padding: 40px 0; }

      /* settled verdict-led */
      .hero { display: flex; gap: 22px; align-items: center; padding: 20px 22px; border-radius: var(--radius-xl); background: radial-gradient(120% 140% at 0% 0%, color-mix(in oklch, var(--side) 8%, transparent), transparent 60%), var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
      .hero .vt { flex: 1; min-width: 0; }
      .hero .eyebrow2 { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .hero h2 { margin: 6px 0 8px; font-size: 21px; font-weight: 780; color: var(--side); line-height: 1.25; }
      .hero .why { font-size: 13.5px; line-height: 1.7; margin: 0; color: var(--foreground); }
      .need { margin-top: 16px; padding: 13px 15px; border-radius: var(--radius-sm); background: color-mix(in oklch, var(--warning) 8%, var(--card)); border: 1px solid color-mix(in oklch, var(--warning) 40%, var(--border)); }
      .need .nt { font-size: 13px; font-weight: 650; color: var(--warning-foreground); display: flex; gap: 6px; align-items: center; }
      .need ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
      .proc { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
      .proc .toggle { display: flex; width: 100%; align-items: center; gap: 9px; background: none; border: 0; cursor: pointer; padding: 6px 2px; font-size: 13.5px; font-weight: 600; color: var(--foreground); font-family: inherit; }
      .proc .toggle .chev { margin-left: auto; color: var(--muted-foreground); transition: 0.15s; }
      .proc.open .toggle .chev { transform: rotate(180deg); }
      .proc .body { display: none; padding-top: 10px; }
      .proc.open .body { display: block; }

      /* live-view toggle */
      .viewrow { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; font-size: 12px; color: var(--muted-foreground); }
      .modeseg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
      .modeseg button { border: 0; background: var(--card); color: var(--muted-foreground); font: inherit; font-size: 12px; font-weight: 600; padding: 5px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
      .modeseg button + button { border-left: 1px solid var(--border); }
      .modeseg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }

      /* chat paradigm (dialogic live) */
      .chat { display: flex; flex-direction: column; gap: 13px; }
      .msg { display: flex; gap: 9px; max-width: 80%; }
      .msg.right { align-self: flex-end; flex-direction: row-reverse; }
      .msg .ava { flex: none; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in oklch, var(--side) 16%, transparent); color: var(--side); font-size: 12px; font-weight: 750; }
      .msg .bubble { border: 1px solid var(--border); border-top: 2px solid var(--side); border-radius: 13px; padding: 9px 13px; background: var(--card); min-width: 0; }
      .msg.wait .bubble { opacity: 0.6; }
      .msg .bnm { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--side); margin-bottom: 5px; }
      .msg .bnm .st { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted-foreground); display: inline-flex; }
      .msg .bnm .st.typing { color: var(--primary); }
      .msg .btxt { font-size: 12.5px; line-height: 1.65; color: var(--foreground); }
      .msg .btxt.muted { color: var(--muted-foreground); }
      .sys { align-self: center; max-width: 84%; text-align: center; font-size: 12px; line-height: 1.55; color: var(--muted-foreground); background: var(--muted); padding: 8px 14px; border-radius: var(--radius-lg); display: inline-flex; gap: 7px; align-items: flex-start; }
      .sys .ico { flex: none; margin-top: 1px; }
      @media (max-width: 640px) { .duo { grid-template-columns: 1fr; } .msg { max-width: 92%; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const sweet = sideBy("sweet"), salty = sideBy("salty"), winner = sideBy(D.brief.leaningSide);
      const partial = (txt) => txt.slice(0, Math.max(8, Math.floor(txt.length * 0.55)));

      function buildFrames() {
        const F = [];
        const base = (upto) => D.rounds.map((_, j) => ({ sweet: j < upto ? "done" : "wait", salty: j < upto ? "done" : "wait", verdict: j < upto }));
        F.push({ phase: "live", label: "准备 · 双方就位", status: "组队完成，辩题已定，准备开始", prog: base(0) });
        D.rounds.forEach((r, ri) => {
          let p = base(ri); p[ri] = { sweet: "typing", salty: "wait", verdict: false };
          F.push({ phase: "live", label: `第${r.no}轮 · ${sweet.name}发言中`, status: `${sweet.name}（甜党）正在陈述…`, prog: p });
          p = base(ri); p[ri] = { sweet: "done", salty: "typing", verdict: false };
          F.push({ phase: "live", label: `第${r.no}轮 · ${salty.name}发言中`, status: `${salty.name}（咸党）正在回应…`, prog: p });
          p = base(ri); p[ri] = { sweet: "done", salty: "done", verdict: true };
          F.push({ phase: "live", label: `第${r.no}轮 · 主持人小结`, status: r.verdict.converged ? "已收敛，准备收场" : "未正面接火，逼出下一轮", prog: p });
        });
        F.push({ phase: "judging", label: "主持人终审裁决中", status: "综合两轮交锋，生成裁决…", prog: base(D.rounds.length) });
        F.push({ phase: "settled", label: "终局 · 裁决出炉", status: D.stopReason, prog: base(D.rounds.length) });
        return F;
      }
      const frames = buildFrames();

      let mode = "chat"; // "arena" | "chat" — 直播段渲染范式（已定：对话式直播）

      const speechCell = (s, st, text) =>
        h(
          "div",
          { class: "spk " + (st === "wait" ? "wait" : ""), style: `--side: var(${s.colorVar})` },
          h(
            "div",
            { class: "nm" },
            h("span", { class: "id-dot", style: `--side: var(${s.colorVar})` }),
            s.name,
            st === "typing" ? h("span", { class: "st typing" }, "输入中…") : st === "done" ? h("span", { class: "st muted" }, svg("check", 12)) : h("span", { class: "st muted" }, "等待"),
          ),
          st === "wait"
            ? h("div", { class: "body" }, "等待发言…")
            : st === "typing"
              ? h("div", { class: "body" }, partial(text), h("span", { class: "caret" }))
              : h("div", { class: "body" }, text),
        );

      const chatMsg = (s, st, text, right) =>
        h(
          "div",
          { class: "msg " + (right ? "right " : "") + (st === "wait" ? "wait" : ""), style: `--side: var(${s.colorVar})` },
          h("div", { class: "ava" }, s.name.slice(0, 1)),
          h(
            "div",
            { class: "bubble" },
            h(
              "div",
              { class: "bnm" },
              s.name,
              st === "typing" ? h("span", { class: "st typing" }, "输入中…") : st === "done" ? h("span", { class: "st" }, svg("check", 11)) : h("span", { class: "st" }, "等待"),
            ),
            st === "wait"
              ? h("div", { class: "btxt muted" }, "等待发言…")
              : st === "typing"
                ? h("div", { class: "btxt" }, partial(text), h("span", { class: "caret" }))
                : h("div", { class: "btxt" }, text),
          ),
        );

      // round speeches in the chosen paradigm (擂台 duo grid vs 对话式 chat bubbles)
      const roundBody = (r, sweetSt, saltySt) =>
        mode === "chat"
          ? h("div", { class: "chat" }, chatMsg(sweet, sweetSt, r.speeches.sweet, false), chatMsg(salty, saltySt, r.speeches.salty, true))
          : h("div", { class: "duo" }, speechCell(sweet, sweetSt, r.speeches.sweet), speechCell(salty, saltySt, r.speeches.salty));

      // moderator ruling in the chosen paradigm (擂台 modnote vs 对话式 centered system line)
      const modBlock = (r) => {
        const txt = (r.verdict.converged ? "主持人：已收敛 — " : "主持人：未收敛 — ") + r.verdict.rationale;
        return mode === "chat"
          ? h("div", { class: "chat" }, h("div", { class: "sys" }, h("span", { class: "ico" }, svg("gavel", 13)), txt))
          : h("div", { class: "modnote" }, h("span", { class: "ico" }, svg("gavel", 14)), h("span", {}, h("b", {}, r.verdict.converged ? "主持人：已收敛 — " : "主持人：未收敛 — "), r.verdict.rationale));
      };

      function renderLive(f) {
        const wrap = h("div", {});
        wrap.append(
          f.phase === "judging"
            ? h("div", { class: "pending judging" }, svg("gavel", 15), "主持人裁决生成中…", h("span", { class: "shim" }))
            : h("div", { class: "pending" }, svg("scale", 14), "裁决 / 你要拍的板 —— 收敛后由主持人终审生成"),
        );
        let anyStarted = false;
        D.rounds.forEach((r, ri) => {
          const pr = f.prog[ri];
          if (pr.sweet === "wait" && pr.salty === "wait" && !pr.verdict) return;
          anyStarted = true;
          const rnd = h(
            "div",
            { class: "rnd" },
            h("div", { class: "live-head" }, h("span", { class: "pill pill-muted" }, "第 " + r.no + " 轮"), h("span", { class: "rno" }, r.focus)),
            roundBody(r, pr.sweet, pr.salty),
          );
          if (pr.verdict) rnd.append(modBlock(r));
          wrap.append(rnd);
        });
        if (!anyStarted) wrap.append(h("div", { class: "waitstart" }, "等待第 1 轮开始…"));
        return wrap;
      }

      function renderSettled() {
        const wrap = h("div", { style: `--side: var(${winner.colorVar})` });
        wrap.append(
          h(
            "div",
            { class: "hero" },
            h("div", { class: "ring", style: `--pct:${D.brief.confidencePct};--ring-color:var(--warning);--size:92px` }, h("div", { class: "val" }, h("b", {}, D.brief.confidencePct + "%"), h("br"), h("small", {}, "置信 " + D.brief.confidenceLabel))),
            h("div", { class: "vt" }, h("div", { class: "eyebrow2" }, "主持人终审 · 结论倾向"), h("h2", {}, D.brief.leaningTitle), h("p", { class: "why" }, D.brief.leaning)),
          ),
          h(
            "div",
            { class: "need" },
            h("div", { class: "nt" }, svg("user", 14), "需要你拍板（价值之争，AI 判不了）"),
            h("ul", {}, ...D.brief.valueDisputes.map((t) => h("li", {}, t))),
          ),
        );
        const proc = h("div", { class: "proc" });
        const body = h("div", { class: "body" });
        D.rounds.forEach((r) => {
          body.append(
            h(
              "div",
              { class: "rnd" },
              h("div", { class: "live-head" }, h("span", { class: "pill pill-muted" }, "第 " + r.no + " 轮"), h("span", { class: "rno" }, r.focus), r.verdict.converged ? h("span", { class: "pill pill-success" }, "已收敛") : null),
              roundBody(r, "done", "done"),
            ),
          );
        });
        const toggle = h("button", { class: "toggle", onclick: () => proc.classList.toggle("open") }, svg("scroll", 15), "完整交锋过程 · " + D.rounds.length + " 轮", h("span", { class: "chev" }, svg("chevronDown", 16)));
        proc.append(toggle, body);
        wrap.append(proc);
        return wrap;
      }

      let cur = 0, timer = null;
      const phasechip = h("span", { class: "phasechip" });
      const statusEl = h("span", { class: "status" });
      const fnoEl = h("span", { class: "fno" });
      const surface = h("div", { class: "surface" });
      const scrub = h("input", { type: "range", class: "scrub", min: "0", max: String(frames.length - 1), step: "1", value: "0" });
      const ppBtn = h("button", { class: "pp" }, svg("play", 16));

      function setFrame(i, fromScrub) {
        cur = Math.max(0, Math.min(frames.length - 1, i));
        const f = frames[cur];
        const ptxt = f.phase === "live" ? "直播中" : f.phase === "judging" ? "裁决中" : "已收场";
        const pico = f.phase === "settled" ? svg("check", 12) : h("span", { class: "dot" });
        phasechip.className = "phasechip " + f.phase;
        phasechip.replaceChildren(pico, ptxt);
        statusEl.textContent = f.status;
        fnoEl.textContent = `第 ${cur + 1}/${frames.length} 帧 · ${f.label}`;
        surface.replaceChildren(f.phase === "settled" ? renderSettled() : renderLive(f));
        if (!fromScrub) scrub.value = String(cur);
      }
      function stop() { if (timer) { clearInterval(timer); timer = null; } ppBtn.replaceChildren(svg("play", 16)); }
      function play() {
        if (timer) { stop(); return; }
        if (cur >= frames.length - 1) setFrame(0);
        ppBtn.replaceChildren(svg("pause", 16));
        timer = setInterval(() => { if (cur >= frames.length - 1) { stop(); return; } setFrame(cur + 1); }, 1400);
      }
      ppBtn.addEventListener("click", play);
      scrub.addEventListener("input", () => { stop(); setFrame(Number(scrub.value), true); });

      const segA = h("button", { "aria-pressed": "false" }, "擂台 · 左右对阵");
      const segC = h("button", { "aria-pressed": "true" }, "对话式 · 群聊");
      const setMode = (m) => { mode = m; segA.setAttribute("aria-pressed", String(m === "arena")); segC.setAttribute("aria-pressed", String(m === "chat")); setFrame(cur); };
      segA.addEventListener("click", () => setMode("arena"));
      segC.addEventListener("click", () => setMode("chat"));
      const viewrow = h("div", { class: "viewrow" }, "直播视图：", h("div", { class: "modeseg" }, segA, segC), h("span", {}, "切换直播段与终局过程的渲染范式，比一比哪个更顺"));

      const cl = h("div", { class: "cl" });
      cl.append(
        h("div", { class: "eyebrow" }, "直播态 · 重心迁移（过程演示）"),
        h("h1", { class: "page" }, "拖滑块：从准备 → 逐轮直播 → 收敛终审"),
        h("div", { class: "page-sub" }, "同一个面：直播时过程在主位逐轮流式；主持人终审后，裁决浮到顶部成主角、交锋过程收起为下文。直播段已定为「对话式·群聊」，可在下方切回擂台对比。"),
        h("div", { class: "livebar" }, phasechip, statusEl, ppBtn),
        h("div", { class: "scrubrow" }, scrub, fnoEl),
        viewrow,
        h("div", { class: "hintbar" }, svg("sliders", 13), "提示：滑到最后一帧，看「重心迁移」—— 裁决 hero 浮顶、过程退为可展开下文。"),
        surface,
      );
      document.getElementById("root").append(cl);
      setFrame(0);
    </script>
  </body>
</html>
