<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>直播交互 · 插话/引导/叫停/站队 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .cl { max-width: 920px; margin: 0 auto; padding: 22px 24px 60px; }
      .cl .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .cl h1.page { margin: 6px 0 4px; font-size: 21px; font-weight: 750; }
      .cl .page-sub { font-size: 13px; color: var(--muted-foreground); margin-bottom: 18px; line-height: 1.6; }

      /* transport */
      .livebar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow-sm); margin-bottom: 8px; }
      .phasechip { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; padding: 5px 11px; border-radius: 999px; }
      .phasechip.live { background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); }
      .phasechip.judging { background: color-mix(in oklch, var(--warning) 14%, transparent); color: var(--warning-foreground); }
      .phasechip.settled { background: color-mix(in oklch, var(--success) 14%, transparent); color: var(--success); }
      .phasechip .dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
      .phasechip.live .dot { animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .livebar .status { flex: 1; min-width: 0; font-size: 13px; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .livebar .pp { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; cursor: pointer; }
      .scrubrow { display: flex; align-items: center; gap: 12px; margin: 10px 2px 4px; }
      .scrubrow .scrub { flex: 1; accent-color: var(--primary); cursor: pointer; }
      .scrubrow .fno { flex: none; font-size: 12px; color: var(--muted-foreground); min-width: 150px; text-align: right; white-space: nowrap; }
      .hintbar { font-size: 12px; color: var(--muted-foreground); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }

      /* surface */
      .surface { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow-sm); padding: 18px 20px; min-height: 320px; }

      .pending { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px dashed var(--border); color: var(--muted-foreground); font-size: 12.5px; margin-bottom: 16px; }
      .pending.judging { border-style: solid; border-color: color-mix(in oklch, var(--warning) 40%, var(--border)); background: color-mix(in oklch, var(--warning) 7%, var(--card)); color: var(--warning-foreground); }
      .pending .shim { flex: 1; height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--border) 25%, color-mix(in oklch, var(--warning) 30%, var(--border)) 50%, var(--border) 75%); background-size: 200% 100%; animation: shim 1.3s linear infinite; }
      @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* chat stream */
      .chat { display: flex; flex-direction: column; gap: 12px; }
      .live-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 -2px; flex-wrap: wrap; }
      .live-head .rno { font-size: 12.5px; font-weight: 700; }
      .msg { display: flex; gap: 9px; max-width: 80%; }
      .msg.right { align-self: flex-end; flex-direction: row-reverse; }
      .msg .ava { flex: none; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in oklch, var(--side) 16%, transparent); color: var(--side); font-size: 12px; font-weight: 750; }
      .msg .bubble { border: 1px solid var(--border); border-top: 2px solid var(--side); border-radius: 13px; padding: 9px 13px; background: var(--card); min-width: 0; }
      .msg .bnm { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--side); margin-bottom: 5px; }
      .msg .bnm .st { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted-foreground); display: inline-flex; }
      .msg .bnm .st.typing { color: var(--primary); }
      .msg .btxt { font-size: 12.5px; line-height: 1.65; color: var(--foreground); }
      .caret { display: inline-block; width: 2px; height: 1em; background: var(--side, var(--primary)); margin-left: 2px; vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* user interjection card (distinct from debaters) */
      .uact { display: flex; gap: 10px; align-items: flex-start; border: 1px solid color-mix(in oklch, var(--primary) 42%, var(--border)); background: color-mix(in oklch, var(--primary) 6%, var(--card)); border-radius: var(--radius-sm); padding: 10px 13px; box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 7%, transparent); }
      .uact .ava { flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-size: 12px; font-weight: 750; }
      .uact .ub { min-width: 0; }
      .uact .ulbl { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 3px; text-transform: none; }
      .uact .utxt { font-size: 12.5px; line-height: 1.6; color: var(--foreground); }

      .sys { align-self: center; max-width: 86%; text-align: center; font-size: 12px; line-height: 1.55; color: var(--muted-foreground); background: var(--muted); padding: 8px 14px; border-radius: var(--radius-lg); display: inline-flex; gap: 7px; align-items: flex-start; }
      .sys .ico { flex: none; margin-top: 1px; }

      /* dock / composer */
      .dock { margin-top: 14px; border: 1px solid color-mix(in oklch, var(--primary) 22%, var(--border)); border-radius: var(--radius-lg); background: var(--card); padding: 11px 13px; box-shadow: var(--shadow-sm); transition: 0.15s; }
      .dock.off { opacity: 0.5; filter: grayscale(0.3); pointer-events: none; }
      .dock .dfocus { font-size: 11.5px; color: var(--muted-foreground); margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
      .dock .dfocus b { color: var(--foreground); font-weight: 650; }
      .dock .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .dchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--foreground); cursor: pointer; font-family: inherit; transition: 0.12s; }
      .dchip:hover { border-color: color-mix(in oklch, var(--primary) 45%, var(--border)); }
      .dchip.stop { color: var(--destructive); }
      .dchip.active { border-color: color-mix(in oklch, var(--primary) 60%, var(--border)); background: color-mix(in oklch, var(--primary) 12%, var(--card)); color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 8%, transparent); }
      .dchip.stop.active { border-color: color-mix(in oklch, var(--destructive) 55%, var(--border)); background: color-mix(in oklch, var(--destructive) 10%, var(--card)); color: var(--destructive); box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 8%, transparent); }
      .composer { display: flex; gap: 8px; align-items: center; }
      .composer input.say { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 12.5px; background: var(--background); color: var(--foreground); }
      .composer input.say:focus { outline: 2px solid color-mix(in oklch, var(--primary) 35%, transparent); outline-offset: 1px; }
      .composer .sendb { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; cursor: pointer; }

      /* settled */
      .hero { display: flex; gap: 22px; align-items: center; padding: 20px 22px; border-radius: var(--radius-xl); background: radial-gradient(120% 140% at 0% 0%, color-mix(in oklch, var(--side) 8%, transparent), transparent 60%), var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
      .hero .vt { flex: 1; min-width: 0; }
      .hero .eyebrow2 { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .hero h2 { margin: 6px 0 8px; font-size: 21px; font-weight: 780; color: var(--side); line-height: 1.25; }
      .hero .why { font-size: 13.5px; line-height: 1.7; margin: 0; color: var(--foreground); }
      .compare { display: flex; gap: 12px; align-items: stretch; margin-top: 14px; flex-wrap: wrap; }
      .cmpcard { flex: 1; min-width: 180px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; background: var(--card); }
      .cmpcard .ct { font-size: 11.5px; color: var(--muted-foreground); margin-bottom: 5px; display: flex; gap: 6px; align-items: center; }
      .cmpcard .cv { font-size: 14px; font-weight: 700; }
      .cmpcard.you .cv { color: var(--primary); }
      .cmpcard.ai .cv { color: var(--side); }
      .cmpcard.match { flex: none; display: flex; align-items: center; }
      .matchpill { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: color-mix(in oklch, var(--success) 14%, transparent); color: var(--success); display: inline-flex; gap: 6px; align-items: center; }
      .need { margin-top: 16px; padding: 13px 15px; border-radius: var(--radius-sm); background: color-mix(in oklch, var(--warning) 8%, var(--card)); border: 1px solid color-mix(in oklch, var(--warning) 40%, var(--border)); }
      .need .nt { font-size: 13px; font-weight: 650; color: var(--warning-foreground); display: flex; gap: 6px; align-items: center; }
      .need ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
      .proc { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
      .proc .toggle { display: flex; width: 100%; align-items: center; gap: 9px; background: none; border: 0; cursor: pointer; padding: 6px 2px; font-size: 13.5px; font-weight: 600; color: var(--foreground); font-family: inherit; }
      .proc .toggle .chev { margin-left: auto; color: var(--muted-foreground); transition: 0.15s; }
      .proc.open .toggle .chev { transform: rotate(180deg); }
      .proc .body { display: none; padding-top: 10px; }
      .proc.open .body { display: block; }
      /* 复盘 = 擂台（左右对齐） */
      .rnd { margin-bottom: 16px; }
      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
      .spk { border: 1px solid var(--border); border-top: 3px solid var(--side); border-radius: var(--radius-sm); padding: 11px 13px; background: var(--card); }
      .spk .nm { display: flex; align-items: center; gap: 7px; font-weight: 650; color: var(--side); font-size: 12.5px; margin-bottom: 7px; }
      .spk .nm .st { margin-left: auto; font-size: 11px; }
      .spk .body { font-size: 12.5px; line-height: 1.65; color: var(--foreground); }
      .uflag { margin: 6px 0 0; font-size: 11.5px; color: var(--primary); display: inline-flex; gap: 5px; align-items: center; }

      @media (max-width: 640px) { .duo { grid-template-columns: 1fr; } .msg { max-width: 92%; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const sweet = sideBy("sweet"), salty = sideBy("salty");
      const YOU = { name: "你", colorVar: "--primary" };
      const partial = (txt) => txt.slice(0, Math.max(10, Math.floor(txt.length * 0.5)));

      // ---- scripted interaction scenario (8 frames) ----
      const S1 = { round: { no: 1, focus: "豆腐脑最早是甜还是咸？" } };
      const T = {
        sweet1: "原始豆腐脑豆腥味偏重，先民用糖中和最自然；南方「豆腐花」甜口百年传承，是更早、更稳定的形态。",
        salty1: "豆腐脑是「点」出来的——卤水（盐卤）本身就是咸的，咸味是诞生时的化学底色，甜是后来才加的。",
        salty1b: "公允说：直接文献确实有限。但早期记载多见咸味调味，且糖在古代是奢侈品、平民难得，咸口才是常态。",
        sweet2: "糖到近代才平民化没错——但「正统」看的是传承形态：甜口是被广泛接受、稳定流传下来的活态传统。",
        salty2: "成本恰恰是证据：早期普通人吃到的就是咸口。咸是「历史本源」，甜是后世改良，本源该优先。",
      };

      const roundDiv = (no, focus, extra) => ({ k: "round", no, focus, extra });
      const msg = (who, st, text) => ({ k: "msg", who, st, text });
      const sys = (text, ico = "gavel") => ({ k: "sys", text, ico });
      const uact = (kind, ico, text) => ({ k: "uact", kind, ico, text });

      const base1 = [roundDiv(1, S1.round.focus), msg(sweet, "done", T.sweet1)];

      const frames = [
        {
          phase: "live", status: "第 1 轮 · 双方陈述中", action: null,
          focus: "第 1 轮原题", dock: "on",
          stream: [...base1, msg(salty, "typing", T.salty1)],
        },
        {
          phase: "live", status: "你向咸方追问 · 已插入直播流", action: "ask",
          focus: "第 1 轮原题", dock: "on",
          stream: [...base1, msg(salty, "done", T.salty1), uact("追问咸方", "reply", "「化学本源」有早期史料支撑吗？还是后世推断？")],
        },
        {
          phase: "live", status: "主持人采纳你的追问 · 咸方补充举证", action: "ask",
          focus: "第 1 轮原题", dock: "on",
          stream: [...base1, msg(salty, "done", T.salty1), uact("追问咸方", "reply", "「化学本源」有早期史料支撑吗？还是后世推断？"), sys("主持人：已采纳追问，要求咸方就「史料」举证。"), msg(salty, "done", T.salty1b)],
        },
        {
          phase: "live", status: "你为下一轮设定焦点 · 已加码", action: "guide",
          focus: "成本与可得性（你加码）", dock: "on",
          stream: [...base1, msg(salty, "done", T.salty1), uact("追问咸方", "reply", "「化学本源」有早期史料支撑吗？"), sys("主持人：已采纳追问，要求咸方就「史料」举证。"), msg(salty, "done", T.salty1b), uact("引导加码", "lightbulb", "下一轮多谈「成本/可得性」，少跑题到地域。"), sys("主持人：已采纳，第 2 轮聚焦「成本与可得性」。")],
        },
        {
          phase: "live", status: "第 2 轮 · 成本与可得性（按你设定的焦点）", action: null,
          focus: "成本与可得性（你加码）", dock: "on",
          stream: [roundDiv(2, "成本与可得性", "你加码"), msg(sweet, "done", T.sweet2), msg(salty, "done", T.salty2), sys("主持人：已收敛为「本源 vs 传承」的价值之争。")],
        },
        {
          phase: "live", status: "已记录你的倾向 · 咸", action: "side",
          focus: "成本与可得性（你加码）", dock: "on",
          stream: [roundDiv(2, "成本与可得性", "你加码"), msg(sweet, "done", T.sweet2), msg(salty, "done", T.salty2), sys("主持人：已收敛为「本源 vs 传承」的价值之争。"), uact("站队 · 咸", "flag", "我先站「咸为正统」，但想看你怎么判这场价值之争。")],
        },
        {
          phase: "judging", status: "你叫停了辩论 · 主持人开始终审", action: "stop",
          focus: "—", dock: "off",
          stream: [sys("你已提前叫停 · 主持人综合两轮 + 你的 1 次追问、1 次加码出裁决…", "ban")],
        },
        { phase: "settled", status: "终局 · 裁决出炉（含你的交互）", action: null, focus: "—", dock: "hide" },
      ];

      // ---- renderers ----
      const chatMsg = (s, st, text) => {
        const right = s === salty; // sweet 左、salty 右
        return h(
          "div",
          { class: "msg " + (right ? "right" : ""), style: `--side: var(${s.colorVar})` },
          h("div", { class: "ava" }, s.name.slice(0, 1)),
          h(
            "div",
            { class: "bubble" },
            h("div", { class: "bnm" }, s.name, st === "typing" ? h("span", { class: "st typing" }, "输入中…") : h("span", { class: "st" }, svg("check", 11))),
            st === "typing" ? h("div", { class: "btxt" }, partial(text), h("span", { class: "caret" })) : h("div", { class: "btxt" }, text),
          ),
        );
      };
      const userCard = (it) =>
        h(
          "div",
          { class: "uact" },
          h("div", { class: "ava" }, "你"),
          h("div", { class: "ub" }, h("div", { class: "ulbl" }, svg(it.ico, 12), it.kind), h("div", { class: "utxt" }, it.text)),
        );
      const sysLine = (it) => h("div", { class: "chat" }, h("div", { class: "sys" }, h("span", { class: "ico" }, svg(it.ico, 13)), it.text));

      function renderStream(items) {
        const wrap = h("div", {});
        let chat = null;
        const flush = () => { chat = null; };
        for (const it of items) {
          if (it.k === "round") {
            flush();
            wrap.append(h("div", { class: "live-head" }, h("span", { class: "pill pill-muted" }, "第 " + it.no + " 轮"), h("span", { class: "rno" }, it.focus), it.extra ? h("span", { class: "pill pill-primary" }, it.extra) : null));
            continue;
          }
          if (it.k === "sys") { flush(); wrap.append(sysLine(it)); continue; }
          if (!chat) { chat = h("div", { class: "chat" }); wrap.append(chat); }
          chat.append(it.k === "uact" ? userCard(it) : chatMsg(it.who, it.st, it.text));
        }
        return wrap;
      }

      function renderLive(f) {
        const wrap = h("div", {});
        wrap.append(
          f.phase === "judging"
            ? h("div", { class: "pending judging" }, svg("gavel", 15), "主持人裁决生成中…", h("span", { class: "shim" }))
            : h("div", { class: "pending" }, svg("scale", 14), "裁决 / 你要拍的板 —— 收敛或叫停后由主持人终审生成"),
        );
        wrap.append(renderStream(f.stream));
        return wrap;
      }

      const REPLAY = [
        { no: 1, focus: "豆腐脑最早是甜还是咸？", sweet: T.sweet1, salty: T.salty1b, conv: false, uflag: "你的 1 次追问已并入本轮" },
        { no: 2, focus: "成本与可得性", sweet: T.sweet2, salty: T.salty2, conv: true, uflag: "你加码的焦点" },
      ];
      const spkCell = (s, text) => h("div", { class: "spk", style: `--side: var(${s.colorVar})` }, h("div", { class: "nm" }, h("span", { class: "id-dot", style: `--side: var(${s.colorVar})` }), s.name, h("span", { class: "st muted" }, svg("check", 12))), h("div", { class: "body" }, text));

      function renderSettled() {
        const winner = salty; // AI 倾向「咸为正统」
        const wrap = h("div", { style: `--side: var(${winner.colorVar})` });
        wrap.append(
          h(
            "div",
            { class: "hero" },
            h("div", { class: "ring", style: `--pct:65;--ring-color:var(--warning);--size:92px` }, h("div", { class: "val" }, h("b", {}, "65%"), h("br"), h("small", {}, "置信 中"))),
            h("div", { class: "vt" }, h("div", { class: "eyebrow2" }, "主持人终审 · 结论倾向"), h("h2", {}, "倾向「咸为正统」"), h("p", { class: "why" }, "结合你追问出的史料局限与你加码的「成本/可得性」视角：早期平民可得的多为咸口，咸更接近历史本源；甜口是被广泛接受的传承形态。两者其实在回答不同问题。")),
          ),
          h(
            "div",
            { class: "compare" },
            h("div", { class: "cmpcard you" }, h("div", { class: "ct" }, svg("flag", 12), "你的倾向"), h("div", { class: "cv" }, "咸为正统")),
            h("div", { class: "cmpcard ai" }, h("div", { class: "ct" }, svg("gavel", 12), "AI 裁决"), h("div", { class: "cv" }, "倾向「咸」")),
            h("div", { class: "cmpcard match" }, h("span", { class: "matchpill" }, svg("check", 13), "与你一致")),
          ),
          h(
            "div",
            { class: "need" },
            h("div", { class: "nt" }, svg("user", 14), "仍需你拍板（价值之争，AI 判不了）"),
            h("ul", {}, h("li", {}, "「正统」按原初工艺（点卤即咸），还是历史上最早被广泛接受并流传的形态？"), h("li", {}, "是否承认「地域正统」——南甜北咸各自成立？")),
          ),
        );
        const proc = h("div", { class: "proc" });
        const body = h("div", { class: "body" });
        REPLAY.forEach((r) => {
          body.append(
            h(
              "div",
              { class: "rnd" },
              h("div", { class: "live-head" }, h("span", { class: "pill pill-muted" }, "第 " + r.no + " 轮"), h("span", { class: "rno" }, r.focus), r.conv ? h("span", { class: "pill pill-success" }, "已收敛") : null),
              h("div", { class: "duo" }, spkCell(sweet, r.sweet), spkCell(salty, r.salty)),
              r.uflag ? h("div", { class: "uflag" }, svg("hand", 12), r.uflag) : null,
            ),
          );
        });
        const toggle = h("button", { class: "toggle", onclick: () => proc.classList.toggle("open") }, svg("scroll", 15), "完整交锋过程 · 擂台复盘 · 2 轮", h("span", { class: "chev" }, svg("chevronDown", 16)));
        proc.append(toggle, body);
        wrap.append(proc);
        return wrap;
      }

      // ---- dock (interaction affordances) ----
      const DOCK = [
        { id: "ask", label: "追问双方", ico: "reply", to: 1 },
        { id: "guide", label: "引导加码", ico: "lightbulb", to: 3 },
        { id: "side", label: "站队拍板", ico: "flag", to: 5 },
        { id: "stop", label: "提前叫停", ico: "ban", to: 6, stop: true },
      ];
      const dockEl = h("div", { class: "dock" });
      const dfocusVal = h("b", {}, "");
      const dchips = h("div", { class: "chips" });
      const dockChipEls = {};
      DOCK.forEach((d) => {
        const el = h("button", { class: "dchip" + (d.stop ? " stop" : ""), onclick: () => { stop(); setFrame(d.to); } }, svg(d.ico, 13), d.label);
        dockChipEls[d.id] = el;
        dchips.append(el);
      });
      const sayInput = h("input", { class: "say", type: "text", placeholder: "插话 / 追问双方或主持人…（回车发送）" });
      const sendBtn = h("button", { class: "sendb" }, svg("send", 15));
      const doSay = () => { stop(); setFrame(1); sayInput.value = ""; };
      sendBtn.addEventListener("click", doSay);
      sayInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSay(); });
      dockEl.append(
        h("div", { class: "dfocus" }, svg("target", 12), "下一轮焦点：", dfocusVal),
        dchips,
        h("div", { class: "composer" }, sayInput, sendBtn),
      );

      function syncDock(f) {
        dfocusVal.textContent = f.focus;
        DOCK.forEach((d) => dockChipEls[d.id].classList.toggle("active", d.id === f.action));
        dockEl.classList.toggle("off", f.dock === "off");
        dockEl.style.display = f.dock === "hide" ? "none" : "";
        if (f.dock === "off") dfocusVal.textContent = "辩论已叫停，等待裁决";
      }

      // ---- transport ----
      let cur = 0, timer = null;
      const phasechip = h("span", { class: "phasechip" });
      const statusEl = h("span", { class: "status" });
      const fnoEl = h("span", { class: "fno" });
      const surface = h("div", { class: "surface" });
      const scrub = h("input", { type: "range", class: "scrub", min: "0", max: String(frames.length - 1), step: "1", value: "0" });
      const ppBtn = h("button", { class: "pp" }, svg("play", 16));

      function setFrame(i, fromScrub) {
        cur = Math.max(0, Math.min(frames.length - 1, i));
        const f = frames[cur];
        const ptxt = f.phase === "live" ? "直播中" : f.phase === "judging" ? "裁决中" : "已收场";
        const pico = f.phase === "settled" ? svg("check", 12) : h("span", { class: "dot" });
        phasechip.className = "phasechip " + f.phase;
        phasechip.replaceChildren(pico, ptxt);
        statusEl.textContent = f.status;
        fnoEl.textContent = `第 ${cur + 1}/${frames.length} 帧 · ${f.status}`;
        surface.replaceChildren(f.phase === "settled" ? renderSettled() : renderLive(f));
        syncDock(f);
        if (!fromScrub) scrub.value = String(cur);
      }
      function stop() { if (timer) { clearInterval(timer); timer = null; } ppBtn.replaceChildren(svg("play", 16)); }
      function play() {
        if (timer) { stop(); return; }
        if (cur >= frames.length - 1) setFrame(0);
        ppBtn.replaceChildren(svg("pause", 16));
        timer = setInterval(() => { if (cur >= frames.length - 1) { stop(); return; } setFrame(cur + 1); }, 1500);
      }
      ppBtn.addEventListener("click", play);
      scrub.addEventListener("input", () => { stop(); setFrame(Number(scrub.value), true); });

      const cl = h("div", { class: "cl" });
      cl.append(
        h("div", { class: "eyebrow" }, "直播态 · 用户交互（过程演示）"),
        h("h1", { class: "page" }, "直播中你能做什么：追问 / 引导 / 站队 / 叫停"),
        h("div", { class: "page-sub" }, "直播段用「对话式」流式呈现；底部「交互坞」是你介入的入口。拖滑块走一遍：插话追问 → 被主持人采纳 → 引导加码改下一轮焦点 → 站队 → 提前叫停 → 终审（裁决会对比「你的倾向 vs AI」，并把你的追问/加码并入复盘）。复盘用「擂台」左右对齐。"),
        h("div", { class: "livebar" }, phasechip, statusEl, ppBtn),
        h("div", { class: "scrubrow" }, scrub, fnoEl),
        h("div", { class: "hintbar" }, svg("sliders", 13), "提示：点交互坞的胶囊（追问/引导/站队/叫停）可直接跳到对应演示帧。"),
        surface,
        dockEl,
      );
      document.getElementById("root").append(cl);
      setFrame(0);
    </script>
  </body>
</html>
