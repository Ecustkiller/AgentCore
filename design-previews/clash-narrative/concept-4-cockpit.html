<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念 4 · 决策驾驶舱 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .c4 { max-width: 880px; margin: 0 auto; padding: 24px 24px 64px; }
      .c4 .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .c4 h1.page { margin: 6px 0 4px; font-size: 21px; font-weight: 750; }
      .c4 .page-sub { font-size: 13.5px; color: var(--muted-foreground); margin-bottom: 20px; }

      /* live verdict cockpit */
      .cockpit {
        display: flex; gap: 26px; align-items: center; padding: 24px 26px;
        border: 1px solid var(--border); border-radius: var(--radius-xl);
        background: radial-gradient(120% 140% at 0% 0%, color-mix(in oklch, var(--side, var(--primary)) 8%, transparent), transparent 60%), var(--card);
        box-shadow: var(--shadow-md); transition: 0.25s;
      }
      .cockpit .vt { flex: 1; min-width: 0; }
      .cockpit .lbl { font-size: 12px; font-weight: 600; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
      .cockpit h2 { margin: 7px 0 9px; font-size: 22px; font-weight: 780; line-height: 1.25; color: var(--side, var(--foreground)); transition: 0.25s; }
      .cockpit .why { font-size: 13.5px; line-height: 1.7; color: var(--foreground); margin: 0; }

      /* controls */
      .ctrls { margin-top: 24px; }
      .ctrls .hd { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 650; margin-bottom: 4px; }
      .ctrls .hd .ico { color: var(--primary); }
      .ctrls .hint { font-size: 12.5px; color: var(--muted-foreground); margin-bottom: 14px; }
      .ctrl { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px 16px; margin-bottom: 12px; background: var(--card); }
      .ctrl .q { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
      .ctrl .seg { display: flex; gap: 4px; padding: 4px; margin-top: 11px; border: 1px solid var(--border); border-radius: 11px; background: var(--muted); }
      .ctrl .seg button {
        flex: 1; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; cursor: pointer;
        font-family: inherit; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; transition: 0.12s; text-align: center;
      }
      .ctrl .seg button .imp { display: block; font-size: 11px; margin-top: 3px; opacity: 0.75; }
      .ctrl .seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); font-weight: 650; }

      /* locked facts */
      .facts { margin-top: 26px; border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: 15px 17px; background: color-mix(in oklch, var(--muted) 50%, transparent); }
      .facts .fh { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 650; }
      .facts .fh .ico { color: var(--muted-foreground); }
      .facts .fh .tag { margin-left: auto; }
      .facts ul { margin: 11px 0 0; padding: 0; list-style: none; }
      .facts li { position: relative; padding-left: 22px; font-size: 13px; line-height: 1.6; margin-bottom: 8px; color: var(--foreground); }
      .facts li:last-child { margin-bottom: 0; }
      .facts li .ico { position: absolute; left: 0; top: 2px; color: var(--success); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);

      // adjustable value layer → verdict model (mock)
      const state = { orthodoxy: "craft", pluralism: "no" };

      const LOCKED_FACTS = [
        "点卤（盐卤）本身致咸 —— 豆腐脑诞生即带咸的物理底色。",
        "蔗糖精制到明代才成熟，古代糖长期稀缺、昂贵。",
        "甜豆腐花的甜口，更可能是蔗糖普及后的地方创新。",
      ];

      function compute() {
        if (state.pluralism === "yes") {
          return {
            side: null,
            title: "甜咸各为「地域正统」",
            pct: null, label: "争点消解",
            why: "你接受地域多元 —— 南甜北咸各自正统，「谁才是正统」之争本身被消解，无需裁决谁压谁。",
          };
        }
        if (state.orthodoxy === "craft") {
          return {
            side: "salty",
            title: "倾向「咸为正统」",
            pct: 75, label: "中高",
            why: "你以「原初工艺」为正统标准：点卤即咸是诞生的化学底色，加上古代糖长期稀缺，工艺本源清晰指向咸。",
          };
        }
        return {
          side: "sweet",
          title: "倾向「甜为正统」",
          pct: 58, label: "中",
          why: "你以「历史流变」为正统标准：看流传最广、最被稳定接受的形态 —— 南方甜豆腐花百年传承倾向甜；但缺唐宋以前硬证据，置信偏中。",
        };
      }

      const cockpit = h("div", { class: "cockpit" });
      function renderCockpit() {
        const r = compute();
        const s = r.side ? sideBy(r.side) : null;
        cockpit.setAttribute("style", s ? `--side: var(${s.colorVar})` : "--side: var(--muted-foreground)");
        cockpit.replaceChildren(
          r.pct == null
            ? h("div", { class: "ring", style: "--pct:100;--ring-color:var(--border);--size:104px" }, h("div", { class: "val" }, h("b", { style: "font-size:17px" }, "—"), h("br"), h("small", {}, r.label)))
            : h("div", { class: "ring", style: `--pct:${r.pct};--ring-color:var(--side);--size:104px` }, h("div", { class: "val" }, h("b", {}, r.pct + "%"), h("br"), h("small", {}, "置信 " + r.label))),
          h(
            "div",
            { class: "vt" },
            h("div", { class: "lbl" }, svg("activity", 14), "实时裁决 · 随你的取向变化"),
            h("h2", {}, r.title),
            h("p", { class: "why" }, r.why),
          ),
        );
      }

      const seg = (key, opts) => {
        const wrap = h("div", { class: "seg" });
        opts.forEach((o) => {
          const b = h(
            "button",
            {
              "aria-pressed": String(state[key] === o.v),
              onclick: () => { state[key] = o.v; renderCockpit(); wrap.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", String(opts[i].v === o.v))); },
            },
            o.t,
            h("span", { class: "imp" }, o.imp),
          );
          wrap.append(b);
        });
        return wrap;
      };

      const c4 = h("div", { class: "c4" });
      c4.append(
        h("div", { class: "eyebrow" }, "决策驾驶舱 · 把价值之争变成你能拨的开关"),
        h("h1", { class: "page" }, "结论不是写死的 —— 取决于你怎么定「正统」"),
        h("div", { class: "page-sub" }, "AI 已把能判的事实都判完了；剩下的是价值取向。拨动下面的开关，上面的裁决会当场重算。"),
        cockpit,
      );

      const ctrls = h("div", { class: "ctrls" });
      ctrls.append(
        h("div", { class: "hd" }, h("span", { class: "ico" }, svg("sliders", 15)), "你的取向（可调）"),
        h("div", { class: "hint" }, "这两件 AI 判不了 —— 得你来定，定了结论才算数。"),
        h(
          "div",
          { class: "ctrl" },
          h("div", { class: "q" }, "你认为「正统」该怎么定？"),
          seg("orthodoxy", [
            { v: "craft", t: "原初工艺（点卤即咸）", imp: "→ 倾向 咸" },
            { v: "history", t: "历史流变（流传最广）", imp: "→ 倾向 甜" },
          ]),
        ),
        h(
          "div",
          { class: "ctrl" },
          h("div", { class: "q" }, "接受「南北各自为正统」的地域多元吗？"),
          seg("pluralism", [
            { v: "no", t: "不接受 · 要分高下", imp: "→ 仍需裁决" },
            { v: "yes", t: "接受 · 各为地域正统", imp: "→ 争点消解" },
          ]),
        ),
      );
      c4.append(ctrls);

      const facts = h("div", { class: "facts" });
      facts.append(
        h("div", { class: "fh" }, h("span", { class: "ico" }, svg("scale", 15)), "事实层（已澄清，不受你的取向影响）", h("span", { class: "tag pill pill-success" }, svg("check", 12), "锁定")),
        h("ul", {}, ...LOCKED_FACTS.map((t) => h("li", {}, h("span", { class: "ico" }, svg("check", 14)), t))),
      );
      c4.append(facts);

      renderCockpit();
      document.getElementById("root").append(c4);
    </script>
  </body>
</html>
