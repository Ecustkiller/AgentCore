<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念 9 · 选边体验 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .c9 { max-width: 680px; margin: 0 auto; padding: 26px 24px 60px; }
      .intro { font-size: 13px; color: var(--muted-foreground); text-align: center; margin-bottom: 18px; }

      .stepper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 22px; }
      .stepper .st { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted-foreground); }
      .stepper .st .dot { width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--card); }
      .stepper .st.on .dot { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .stepper .st.on { color: var(--foreground); font-weight: 600; }
      .stepper .st.done .dot { background: color-mix(in oklch, var(--primary) 14%, transparent); color: var(--primary); border-color: color-mix(in oklch, var(--primary) 40%, var(--border)); }
      .stepper .sep { width: 20px; height: 2px; background: var(--border); }

      .stage { border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 26px 26px; background: var(--card); box-shadow: var(--shadow-md); min-height: 280px; }

      /* steelman */
      .steel .who { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
      .steel .who .av { width: 48px; height: 48px; border-radius: 999px; flex: none; background: color-mix(in oklch, var(--side) 16%, transparent); color: var(--side); display: grid; place-items: center; font-size: 20px; font-weight: 800; }
      .steel .who .nm { font-size: 18px; font-weight: 750; color: var(--side); }
      .steel .who .meta { display: flex; gap: 6px; margin-top: 3px; }
      .steel .thesis { font-size: 15px; line-height: 1.7; color: var(--foreground); padding: 14px 16px; border-left: 3px solid var(--side); background: color-mix(in oklch, var(--side) 5%, transparent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
      .steel .sps { margin-top: 16px; }
      .steel .sps .sl { font-size: 12px; font-weight: 600; color: var(--muted-foreground); margin-bottom: 8px; }
      .steel .sp { font-size: 13px; line-height: 1.7; margin-bottom: 10px; padding-left: 12px; border-left: 2px solid var(--border); }
      .steel .sp .rd { font-weight: 600; color: var(--muted-foreground); font-size: 12px; margin-right: 6px; }

      /* vote */
      .vote h2 { text-align: center; font-size: 19px; font-weight: 750; margin: 6px 0 4px; }
      .vote .vsub { text-align: center; font-size: 13px; color: var(--muted-foreground); margin-bottom: 20px; }
      .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .vote-b { padding: 22px 16px; border: 1px solid var(--border); border-top: 3px solid var(--side); border-radius: var(--radius-lg); cursor: pointer; text-align: center; background: var(--card); font-family: inherit; transition: 0.12s; }
      .vote-b:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
      .vote-b .big { font-size: 18px; font-weight: 780; color: var(--side); }
      .vote-b .sm { font-size: 12px; color: var(--muted-foreground); margin-top: 5px; }
      .vote-unsure { width: 100%; margin-top: 12px; padding: 13px; border: 1px dashed var(--border); border-radius: var(--radius-lg); background: var(--card); cursor: pointer; font-family: inherit; font-size: 13.5px; color: var(--muted-foreground); }
      .vote-unsure:hover { color: var(--foreground); border-color: var(--muted-foreground); }

      /* reveal */
      .reveal .res { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
      .reveal .res .vt .lbl { font-size: 12px; color: var(--muted-foreground); }
      .reveal .res .vt h2 { margin: 5px 0 0; font-size: 21px; font-weight: 780; color: var(--side); }
      .reveal .cmp { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13.5px; margin-bottom: 16px; }
      .reveal .cmp.same { background: color-mix(in oklch, var(--success) 12%, transparent); color: var(--success); }
      .reveal .cmp.diff { background: color-mix(in oklch, var(--warning) 14%, transparent); color: var(--warning-foreground); }
      .reveal .why { font-size: 13.5px; line-height: 1.7; color: var(--foreground); }
      .reveal .need { margin-top: 16px; padding: 13px 15px; border-radius: var(--radius-sm); background: color-mix(in oklch, var(--warning) 8%, var(--card)); border: 1px solid color-mix(in oklch, var(--warning) 40%, var(--border)); }
      .reveal .need .nt { font-size: 13px; font-weight: 650; color: var(--warning-foreground); display: flex; gap: 6px; align-items: center; }
      .reveal .need ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }

      .nav { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
      .nav button { padding: 11px 18px; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--foreground); display: inline-flex; align-items: center; gap: 7px; }
      .nav button:hover { background: var(--accent); }
      .nav .primary { margin-left: auto; background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .nav .primary:hover { background: var(--primary); filter: brightness(1.05); }
      .nav .ghost { color: var(--muted-foreground); border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const sweet = sideBy("sweet"), salty = sideBy("salty");
      const winner = sideBy(D.brief.leaningSide);

      const STAGES = ["sweet", "salty", "vote", "reveal"];
      const STEP_LABELS = ["听甜党", "听咸党", "你来投票", "揭晓裁决"];
      const state = { i: 0, vote: null };

      const stepper = h("div", { class: "stepper" });
      const stage = h("div", { class: "stage" });
      const nav = h("div", { class: "nav" });

      const steelman = (s) =>
        h(
          "div",
          { class: "steel", style: `--side: var(${s.colorVar})` },
          h(
            "div",
            { class: "who" },
            h("div", { class: "av" }, s.name.slice(0, 1)),
            h(
              "div",
              {},
              h("div", { class: "nm" }, s.name + " · " + s.stance),
              h("div", { class: "meta" }, h("span", { class: "pill pill-outline" }, s.model), h("span", { class: "pill pill-muted" }, "最强陈词")),
            ),
          ),
          h("div", { class: "thesis" }, s.point),
          h(
            "div",
            { class: "sps" },
            h("div", { class: "sl" }, "TA 在各轮的发言"),
            ...D.rounds.map((r) => h("div", { class: "sp" }, h("span", { class: "rd" }, "第" + r.no + "轮"), r.speeches[s.key])),
          ),
        );

      const voteUI = () => {
        const wrap = h("div", { class: "vote" });
        wrap.append(
          h("h2", {}, "听完两边，你站哪边？"),
          h("div", { class: "vsub" }, "先有自己的判断，再看 AI 怎么裁 —— 这能帮你认清这到底是事实之争还是口味之争。"),
        );
        const votes = h("div", { class: "votes" });
        [sweet, salty].forEach((s) => {
          const b = h(
            "button",
            { class: "vote-b", style: `--side: var(${s.colorVar})` },
            h("div", { class: "big" }, s.stance),
            h("div", { class: "sm" }, s.name),
          );
          b.addEventListener("click", () => { state.vote = s.key; go(3); });
          votes.append(b);
        });
        wrap.append(votes);
        const unsure = h("button", { class: "vote-unsure" }, "两边都有道理，我还没法定 →");
        unsure.addEventListener("click", () => { state.vote = "unsure"; go(3); });
        wrap.append(unsure);
        return wrap;
      };

      const revealUI = () => {
        const agree = state.vote === D.brief.leaningSide;
        const unsure = state.vote === "unsure";
        const cmp = unsure
          ? h("div", { class: "cmp diff" }, svg("user", 14), "你还没法定 —— 正好，这本就被澄清为价值之争，AI 也只能给倾向。")
          : agree
            ? h("div", { class: "cmp same" }, svg("check", 14), "你的直觉和 AI 裁判一致")
            : h("div", { class: "cmp diff" }, svg("rotate", 14), "你和 AI 裁判选了不同边 —— 看看分歧在哪");
        return h(
          "div",
          { class: "reveal", style: `--side: var(${winner.colorVar})` },
          h(
            "div",
            { class: "res" },
            h("div", { class: "ring", style: `--pct:${D.brief.confidencePct};--ring-color:var(--warning);--size:74px` }, h("div", { class: "val" }, h("b", { style: "font-size:17px" }, D.brief.confidencePct + "%"))),
            h("div", { class: "vt" }, h("div", { class: "lbl" }, "AI 裁判倾向 · 置信 " + D.brief.confidenceLabel), h("h2", {}, D.brief.leaningTitle)),
          ),
          cmp,
          h("p", { class: "why" }, D.brief.leaning),
          h(
            "div",
            { class: "need" },
            h("div", { class: "nt" }, svg("user", 14), "但这几条 AI 判不了，得你拍板"),
            h("ul", {}, ...D.brief.valueDisputes.map((t) => h("li", {}, t))),
          ),
        );
      };

      function renderStepper() {
        stepper.replaceChildren();
        STEP_LABELS.forEach((lbl, idx) => {
          if (idx) stepper.append(h("span", { class: "sep" }));
          const cls = "st" + (idx === state.i ? " on" : idx < state.i ? " done" : "");
          stepper.append(h("div", { class: cls }, h("span", { class: "dot" }, idx < state.i ? svg("check", 12) : String(idx + 1)), lbl));
        });
      }

      function renderNav() {
        nav.replaceChildren();
        const back = (label, to) => { const b = h("button", { class: "ghost" }, svg("arrowLeft", 14), label); b.addEventListener("click", () => go(to)); return b; };
        const next = (label, to) => { const b = h("button", { class: "primary" }, label, svg("arrowRight", 16)); b.addEventListener("click", () => go(to)); return b; };
        const st = STAGES[state.i];
        if (st === "sweet") nav.append(next("听咸党怎么说", 1));
        else if (st === "salty") nav.append(back("再听甜党", 0), next("我听完了，去投票", 2));
        else if (st === "vote") nav.append(back("再听咸党", 1));
        else if (st === "reveal") nav.append(back("重新投票", 2));
      }

      function render() {
        renderStepper();
        const st = STAGES[state.i];
        stage.replaceChildren(st === "sweet" ? steelman(sweet) : st === "salty" ? steelman(salty) : st === "vote" ? voteUI() : revealUI());
        renderNav();
      }
      function go(i) { state.i = Math.max(0, Math.min(3, i)); render(); }

      const c9 = h("div", { class: "c9" });
      c9.append(h("div", { class: "intro" }, "先别看结论 —— 自己把两边听完，再下判断。"), stepper, stage, nav);
      document.getElementById("root").append(c9);
      render();
    </script>
  </body>
</html>
