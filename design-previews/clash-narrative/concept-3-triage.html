<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>概念 3 · 争点分诊 — 交锋叙事重设计</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .c3 { max-width: 960px; margin: 0 auto; padding: 24px 24px 64px; }

      /* triage summary */
      .tri-head .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
      .tri-head h1 { margin: 6px 0 0; font-size: 21px; font-weight: 750; line-height: 1.3; }
      .verdict-note {
        margin-top: 12px; font-size: 13.5px; color: var(--foreground);
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      }
      .verdict-note b { font-weight: 700; color: var(--side, var(--foreground)); }

      .tri-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 6px; }
      .tri-stat {
        border: 1px solid var(--border); border-radius: var(--radius-lg);
        padding: 14px 16px; background: var(--card); border-left: 4px solid var(--accent-color);
      }
      .tri-stat .n { font-size: 26px; font-weight: 800; line-height: 1; color: var(--accent-color); }
      .tri-stat .lbl { font-size: 13.5px; font-weight: 650; margin-top: 7px; display: flex; align-items: center; gap: 6px; }
      .tri-stat .lbl .ico { color: var(--accent-color); }
      .tri-stat .mn { font-size: 12px; color: var(--muted-foreground); margin-top: 5px; line-height: 1.5; }

      .t-value { --accent-color: var(--warning); }
      .t-fact  { --accent-color: var(--success); }
      .t-open  { --accent-color: var(--muted-foreground); }

      /* group */
      .grp { margin-top: 30px; }
      .grp .ghead {
        display: flex; align-items: center; gap: 9px;
        margin-bottom: 13px; padding-bottom: 9px; border-bottom: 1px solid var(--border);
      }
      .grp .ghead .gi {
        width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center;
        background: color-mix(in oklch, var(--accent-color) 15%, transparent); color: var(--accent-color);
      }
      .grp .ghead .gl { font-size: 15.5px; font-weight: 700; }
      .grp .ghead .gc { font-size: 12px; color: var(--muted-foreground); }
      .grp .ghead .gm { font-size: 12.5px; color: var(--muted-foreground); margin-left: auto; }

      /* crux card */
      .crux {
        border: 1px solid var(--border); border-left: 4px solid var(--accent-color);
        border-radius: var(--radius-lg); background: var(--card);
        box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 14px;
      }
      .crux .q { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; }
      .crux .q .qn { font-size: 15px; font-weight: 680; line-height: 1.55; flex: 1; min-width: 0; }
      .crux .q .badges { display: flex; gap: 6px; flex: none; }

      .crux .stances { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
      .crux .st { padding: 12px 16px; }
      .crux .st.left { border-right: 1px solid var(--border); }
      .crux .st .sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .crux .st .stxt { font-size: 13px; line-height: 1.65; color: var(--foreground); border-left: 3px solid var(--side); padding-left: 11px; }
      .crux .st.win { background: color-mix(in oklch, var(--side) 5%, transparent); }

      .crux .judge {
        display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px;
        border-top: 1px dashed var(--border); background: color-mix(in oklch, var(--accent-color) 5%, var(--card));
      }
      .crux .judge .ji { color: var(--accent-color); margin-top: 1px; }
      .crux .judge .jt { font-size: 13px; line-height: 1.65; color: var(--foreground); flex: 1; min-width: 0; }
      .crux .judge .jt b { font-weight: 650; }
      .crux .judge .disp { flex: none; align-self: flex-start; white-space: nowrap; }

      @media (max-width: 680px) {
        .tri-stats { grid-template-columns: 1fr; }
        .crux .stances { grid-template-columns: 1fr; }
        .crux .st.left { border-right: 0; border-bottom: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <a class="back" href="index.html">‹ 返回</a>
        <span class="title" id="title"></span>
        <div class="tabs">
          <button aria-pressed="true">⚖ 交锋叙事</button>
          <button aria-pressed="false">⛬ 协作图</button>
        </div>
      </div>
      <div id="root"></div>
    </div>

    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script>
      const D = window.DEBATE;
      document.getElementById("title").textContent = D.motion;
      const sideBy = (k) => D.sides.find((s) => s.key === k);
      const winner = sideBy(D.brief.leaningSide);
      const root = document.getElementById("root");
      const c3 = h("div", { class: "c3" });

      const TYPE = {
        value: {
          label: "需你拍板", icon: "user", cls: "t-value", pill: "pill-warning",
          meaning: "价值取向之争 —— AI 判不了，定了你的标准结论才算数",
          disp: () => ({ txt: "你来定", pill: "pill-warning" }),
        },
        fact: {
          label: "事实可判", icon: "scale", cls: "t-fact", pill: "pill-success",
          meaning: "靠证据 / 史料可判 —— 裁判已能给出倾向",
          disp: (c) => ({ txt: "裁判倾向 " + sideBy(c.lean).name, pill: "pill-success" }),
        },
        open: {
          label: "仍待解", icon: "search", cls: "t-open", pill: "pill-muted",
          meaning: "缺关键证据，待考据 —— 也是结论会反转的变量",
          disp: () => ({ txt: "待考据", pill: "pill-muted" }),
        },
      };
      const ORDER = ["value", "fact", "open"];
      const byType = (t) => D.cruxMap.filter((c) => c.type === t);

      const stanceCol = (c, sideKey, cls) => {
        const s = sideBy(sideKey);
        const isWin = c.lean === sideKey;
        return h(
          "div",
          { class: "st " + cls + (isWin ? " win" : ""), style: `--side: var(${s.colorVar})` },
          h(
            "div",
            { class: "sh" },
            h(
              "span",
              { class: "id-chip", style: `--side: var(${s.colorVar})` },
              h("span", { class: "id-dot", style: `--side: var(${s.colorVar})` }),
              h("span", { class: "name" }, s.name),
              h("span", { class: "pill pill-outline" }, s.stance),
            ),
            isWin ? h("span", { class: "pill pill-success" }, svg("check", 12), "更占理") : null,
          ),
          h("div", { class: "stxt" }, c[sideKey]),
        );
      };

      const cruxCard = (c, m) => {
        const disp = m.disp(c);
        return h(
          "div",
          { class: "crux " + m.cls },
          h(
            "div",
            { class: "q" },
            h("span", { class: "qn" }, c.q),
            h("span", { class: "badges" }, h("span", { class: "pill " + m.pill }, c.status)),
          ),
          h("div", { class: "stances" }, stanceCol(c, D.sides[0].key, "left"), stanceCol(c, D.sides[1].key, "right")),
          h(
            "div",
            { class: "judge" },
            h("span", { class: "ji" }, svg("gavel", 15)),
            h("span", { class: "jt" }, h("b", {}, "裁判说明："), c.judge),
            h("span", { class: "pill disp " + disp.pill }, disp.txt),
          ),
        );
      };

      // header
      c3.append(
        h(
          "div",
          { class: "tri-head", style: `--side: var(${winner.colorVar})` },
          h("div", { class: "eyebrow" }, "争点分诊 · 把这场辩论拆成「该谁来定」的几件事"),
          h("h1", {}, "这场争论拆成 " + D.cruxMap.length + " 个争点"),
          h(
            "div",
            { class: "verdict-note" },
            h("span", { class: "pill pill-success" }, svg("check", 13), D.stopReason),
            h("span", {}, "总裁决 ", h("b", {}, D.brief.leaningTitle), " · 置信 " + D.brief.confidencePct + "%"),
            h("span", { class: "muted" }, "—— 但其中需你拍板的几条定了，结论才算数"),
          ),
        ),
      );

      // stats
      const stats = h("div", { class: "tri-stats" });
      ORDER.forEach((t) => {
        const m = TYPE[t];
        stats.append(
          h(
            "div",
            { class: "tri-stat " + m.cls },
            h("div", { class: "n" }, byType(t).length),
            h("div", { class: "lbl" }, h("span", { class: "ico" }, svg(m.icon, 14)), m.label),
            h("div", { class: "mn" }, m.meaning),
          ),
        );
      });
      c3.append(stats);

      // groups
      ORDER.forEach((t) => {
        const items = byType(t);
        if (!items.length) return;
        const m = TYPE[t];
        const grp = h("div", { class: "grp " + m.cls });
        grp.append(
          h(
            "div",
            { class: "ghead" },
            h("span", { class: "gi" }, svg(m.icon, 15)),
            h("span", { class: "gl" }, m.label),
            h("span", { class: "gc" }, items.length + " 个争点"),
            h("span", { class: "gm" }, m.meaning),
          ),
        );
        items.forEach((c) => grp.append(cruxCard(c, m)));
        c3.append(grp);
      });

      root.append(c3);
    </script>
  </body>
</html>
